<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>腦筋急轉彎擂台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Huninn&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@500&display=swap">
<style>
/* Layout: same graph-paper 練習簿 column as 湊湊樂. Home = mode switch + settings; play = question card, options or host controls; category colors: 字謎 red, 邏輯 blue, 數學 green. */
:root{
  --paper:#F3F7FC; --grid:#DCE6F2; --surface:#FFFFFF; --line:#CBD8E8;
  --ink:#1D2942; --muted:#5A6A86;
  --tile:#FFD45E; --tile-edge:#D9A21E; --tile-ink:#3B2A00;
  --op:#2E66D1; --op-soft:#E3ECFB;
  --red:#D23B3B; --red-soft:#FBE4E4; --good:#1F8A55; --good-soft:#DDF2E6;
  --gold:#E9A817;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;
  --f-kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C2B25; --grid:#263A32; --surface:#22352D; --line:#34493F;
    --ink:#EEF2E8; --muted:#A8B8AC;
    --tile:#F3CB52; --tile-edge:#AD8417; --tile-ink:#2A1F00;
    --op:#8DB6FF; --op-soft:#2A4250;
    --red:#FF7D7D; --red-soft:#4A2D2D; --good:#6FD6A0; --good-soft:#1E3B2E;
    --gold:#F1BF3D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C2B25; --grid:#263A32; --surface:#22352D; --line:#34493F;
  --ink:#EEF2E8; --muted:#A8B8AC;
  --tile:#F3CB52; --tile-edge:#AD8417; --tile-ink:#2A1F00;
  --op:#8DB6FF; --op-soft:#2A4250;
  --red:#FF7D7D; --red-soft:#4A2D2D; --good:#6FD6A0; --good-soft:#1E3B2E;
  --gold:#F1BF3D;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font-family:var(--f-display); font-size:16px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
.wrap{max-width:560px;margin:0 auto}
section.screen{display:flex;flex-direction:column;gap:14px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--op);outline-offset:2px}
h1{margin:0;font-size:1.9rem;font-weight:400;letter-spacing:.04em;line-height:1.2;text-wrap:balance}
h1 small{display:block;font-size:.85rem;color:var(--muted);letter-spacing:.02em;margin-top:4px}
h2{margin:0;font-size:1rem;font-weight:400;color:var(--muted);letter-spacing:.06em}

/* ---------- home ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:5px}
.seg button{appearance:none;border:0;background:none;border-radius:11px;padding:10px 6px;font-size:1.08rem;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.seg button small{font-size:.8rem;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--tile);color:var(--tile-ink);box-shadow:0 3px 0 var(--tile-edge)}
.seg button[aria-selected="true"] small{color:var(--tile-ink);opacity:.8}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.panel p{margin:0}
.desc{font-size:.95rem;color:var(--muted)}
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fl{font-size:.9rem;color:var(--muted);width:2.6em;flex:none}
.pills{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.pill{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 13px;font-size:.95rem}
.pill:hover{border-color:var(--op)}
.pill[aria-pressed="true"]{background:var(--op);border-color:var(--op);color:var(--surface)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.names label{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted);min-width:0}
.names input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 10px;font-size:1rem;color:var(--ink)}
.note{font-size:.88rem;color:var(--muted);text-align:center}
details.panel{display:block}
details.panel summary{cursor:pointer;color:var(--muted);letter-spacing:.04em}
.bank h3{margin:16px 0 6px;font-size:1rem;font-weight:400}
.bank ol{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:8px;font-size:.92rem;line-height:1.6}
.bank .ans{color:var(--good)}
.bank .lvs{color:var(--gold);font-size:.85rem;margin-right:4px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip-btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:.88rem;color:var(--ink);text-decoration:none;display:inline-block}
.chip-btn:hover{border-color:var(--op)}

/* ---------- shared play ---------- */
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:1.08rem;background:var(--op);color:var(--surface);width:100%}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn.warm{background:var(--tile);color:var(--tile-ink);box-shadow:0 3px 0 var(--tile-edge)}
.hud{display:flex;align-items:center;gap:6px}
.back{appearance:none;border:0;background:none;color:var(--op);padding:4px 0;font-size:.95rem;white-space:nowrap;flex:none}
.hud .ttl{font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{flex:none;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;white-space:nowrap}
.stat b{font-family:var(--f-num);font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.progress{height:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--good);transition:width .35s ease}
.qcard{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px 20px;display:flex;flex-direction:column;gap:10px}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{border-radius:999px;padding:1px 10px;font-size:.85rem}
.tag.z{background:var(--red-soft);color:var(--red)}
.tag.l{background:var(--op-soft);color:var(--op)}
.tag.m{background:var(--good-soft);color:var(--good)}
.lv{color:var(--gold);letter-spacing:1px}
.pts{margin-left:auto;font-size:.85rem;color:var(--muted)}
.qtext{margin:0;font-size:1.3rem;line-height:1.65;text-wrap:pretty}
.qcard.big .qtext{font-size:1.5rem}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{appearance:none;min-height:54px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:1.05rem;line-height:1.45;text-align:left;display:flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.opt:not(:disabled):hover{border-color:var(--op)}
.opt .k{flex:none;width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:.75rem;color:var(--muted);font-family:var(--f-num)}
.opt .t{min-width:0}
.opt.char .t{font-family:var(--f-kai);font-size:1.8rem;line-height:1}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.reveal{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.reveal p{margin:0}
.rv-head{display:flex;align-items:center;gap:12px}
.tz{width:3.8rem;height:3.8rem;flex:none;display:grid;place-items:center;border:2px solid var(--red);font-family:var(--f-kai);font-weight:700;font-size:2.6rem;line-height:1;color:var(--red);
  background:linear-gradient(var(--red-soft),var(--red-soft)) center/1.5px 100% no-repeat,linear-gradient(var(--red-soft),var(--red-soft)) center/100% 1.5px no-repeat,var(--surface)}
.verdict{font-size:1.1rem;line-height:1.45}
.verdict.ok{color:var(--good)}
.verdict.bad{color:var(--red)}
.verdict .ans{color:var(--ink)}
.exp{color:var(--muted);line-height:1.7}

/* ---------- family ---------- */
.scores{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
.sc{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center;min-width:0}
.sc .nm{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc b{font-family:var(--f-num);font-weight:800;font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.sc.lead{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.sc.bump{animation:bump .5s ease}
@keyframes bump{40%{transform:scale(1.08)}}
.timer{position:relative;height:26px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.timer i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--op-soft)}
.timer.low i{background:var(--red-soft)}
.timer span{position:relative;display:block;text-align:center;font-size:.88rem;line-height:23px;font-variant-numeric:tabular-nums}
.timer.up span{color:var(--red)}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.who button{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 6px;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who button:hover{border-color:var(--good)}
.who .none{grid-column:1 / -1;color:var(--muted)}

/* ---------- result ---------- */
.rhead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.rhead .big{font-family:var(--f-num);font-weight:800;font-size:3.6rem;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.rhead .big small{font-family:var(--f-display);font-weight:400;font-size:1.1rem;color:var(--muted);margin-left:4px}
.rhead p{margin:0}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:10px;padding:8px 12px}
.rank .pos{font-family:var(--f-num);font-weight:800;width:1.6em;text-align:center;color:var(--muted)}
.rank li:first-child .pos{color:var(--gold)}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank b{font-family:var(--f-num);font-weight:800;font-size:1.2rem}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wlist li{border-left:4px solid var(--red);padding:2px 0 2px 10px;line-height:1.6;font-size:.95rem}
.wlist li b{color:var(--good);font-weight:400}

@media (max-width:380px){ .opts.two{grid-template-columns:1fr} .qtext{font-size:1.2rem} }
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="wrap">

  <!-- ========== 首頁 ========== -->
  <section class="screen" id="home">
    <header><h1>腦筋急轉彎擂台<small>國字字謎、邏輯陷阱、數學陷阱，共 <span id="total">80</span> 題</small></h1></header>
    <div class="seg" role="tablist" aria-label="玩法">
      <button type="button" role="tab" id="tabSolo" aria-selected="true">自己挑戰<small>選擇題・馬上看解說</small></button>
      <button type="button" role="tab" id="tabFam" aria-selected="false">全家搶答<small>一人主持・大家用說的</small></button>
    </div>

    <section class="panel" id="soloSet">
      <p class="desc">一次 10 題選擇題。選項裡藏著「最容易上當」的答案，先想清楚再按。</p>
      <div class="field"><span class="fl">題型</span><div class="pills" id="pSoloType"></div></div>
      <div class="field"><span class="fl">難度</span><div class="pills" id="pSoloLv"></div></div>
      <button class="btn warm" id="soloStart" type="button">開始挑戰</button>
      <p class="note" id="soloNote"></p>
    </section>

    <section class="panel" id="famSet" hidden>
      <p class="desc">一台手機當主持人，把題目唸出來，大家用說的搶答。主持人按「看答案」，再點誰答對。★ 題 1 分、★★ 題 2 分、★★★ 題 3 分。</p>
      <div class="field"><span class="fl">人數</span><div class="pills" id="pFamN"></div></div>
      <div class="names" id="names"></div>
      <div class="field"><span class="fl">題數</span><div class="pills" id="pFamCount"></div></div>
      <div class="field"><span class="fl">題型</span><div class="pills" id="pFamType"></div></div>
      <div class="field"><span class="fl">倒數</span><div class="pills" id="pFamTimer"></div></div>
      <button class="btn warm" id="famStart" type="button">開始搶答</button>
    </section>

    <details class="panel bank">
      <summary>題庫一覽（含答案，給家長核對）</summary>
      <div id="bankBody"></div>
    </details>
    <div class="foot">
      <a class="chip-btn" href="index.html">← 五年級湊湊樂</a>
      <button class="chip-btn" id="soundBtn" type="button">音效：開</button>
    </div>
  </section>

  <!-- ========== 自己挑戰 ========== -->
  <section class="screen" id="solo" hidden>
    <div class="hud">
      <button class="back" type="button" data-home>← 回首頁</button>
      <span class="ttl">自己挑戰</span>
      <span class="stat">第 <b id="sNo">1</b> / <span id="sTot">10</span> 題</span>
      <span class="stat">答對 <b id="sRight">0</b></span>
    </div>
    <div class="progress"><i id="sBar"></i></div>
    <article class="qcard">
      <div class="qmeta"><span class="tag" id="sTag"></span><span class="lv" id="sLv"></span></div>
      <p class="qtext" id="sQ"></p>
    </article>
    <div class="opts" id="sOpts"></div>
    <div class="reveal" id="sRev" hidden>
      <div class="rv-head"><span class="tz" id="sTz" hidden></span><p class="verdict" id="sVerdict"></p></div>
      <p class="exp" id="sExp"></p>
      <button class="btn" id="sNext" type="button">下一題</button>
    </div>
  </section>

  <!-- ========== 全家搶答 ========== -->
  <section class="screen" id="fam" hidden>
    <div class="hud">
      <button class="back" type="button" data-home>← 回首頁</button>
      <span class="ttl">全家搶答</span>
      <span class="stat">第 <b id="fNo">1</b> / <span id="fTot">10</span> 題</span>
    </div>
    <div class="scores" id="fScores"></div>
    <div class="timer" id="fTimer"><i id="fTimeBar"></i><span id="fTimeTxt"></span></div>
    <article class="qcard big">
      <div class="qmeta"><span class="tag" id="fTag"></span><span class="lv" id="fLv"></span><span class="pts" id="fPts"></span></div>
      <p class="qtext" id="fQ"></p>
    </article>
    <button class="btn warm" id="fReveal" type="button">看答案</button>
    <div class="reveal" id="fRev" hidden>
      <div class="rv-head"><span class="tz" id="fTz" hidden></span><p class="verdict"><span class="ans" id="fAns"></span></p></div>
      <p class="exp" id="fExp"></p>
      <h2>誰答對？</h2>
      <div class="who" id="fWho"></div>
    </div>
  </section>

  <!-- ========== 成績 ========== -->
  <section class="screen" id="res" hidden>
    <div class="rhead">
      <h2 id="rTitle"></h2>
      <p class="big" id="rBig"></p>
      <p id="rLine"></p>
    </div>
    <section class="panel" id="rPanel">
      <h2 id="rListTitle"></h2>
      <ol class="rank" id="rRank" hidden></ol>
      <ul class="wlist" id="rList"></ul>
    </section>
    <button class="btn warm" id="rAgain" type="button">再來一輪</button>
    <button class="btn ghost" type="button" data-home>回首頁</button>
  </section>
</div>

<script>
(function(){
"use strict";
/*DATA-START*/
// [題型 z=字謎 l=邏輯陷阱 m=數學陷阱, 難度1-3, 題目, 答案, [三個誘答], 解說]
const RAW = [
 ['z',1,'日月同輝（打一字）','明',['朋','昌','晶'],'「日」加「月」就是「明」。'],
 ['z',1,'一人一口（打一字）','合',['囚','古','回'],'「人」、「一」、「口」由上往下疊起來，就是「合」。人被關在口裡面是「囚」，不一樣喔。'],
 ['z',1,'門裡有張口（打一字）','問',['間','聞','閃'],'「門」裡面一個「口」是「問」。門裡有日是「間」，有耳是「聞」，有人是「閃」。'],
 ['z',1,'一個人靠著一棵樹（打一字）','休',['林','什','伴'],'「亻」靠著「木」就是「休」，人靠在樹旁休息。'],
 ['z',1,'山上還有山（打一字）','出',['岳','峰','仙'],'兩個「山」上下疊起來，就是「出」。'],
 ['z',1,'三個口疊起來（打一字）','品',['器','回','呂'],'上面一個口、下面兩個口，就是「品」。'],
 ['z',1,'女孩子（打一字）','好',['妙','姿','字'],'「女」加「子」就是「好」。'],
 ['z',1,'上小下大（打一字）','尖',['奈','太','天'],'上面「小」、下面「大」，就是「尖」。'],
 ['z',1,'大口套小口（打一字）','回',['呂','品','田'],'大的「口」裡面再套一個小「口」，就是「回」。'],
 ['z',1,'兩木成林，三木成什麼？（打一字）','森',['林','楚','杉'],'三個「木」合起來是「森」。'],
 ['z',1,'口字裡面有個十（打一字）','田',['古','由','申'],'「口」裡面一個「十」是「田」。「由」、「申」的直線會穿出口外。'],
 ['z',2,'一口咬掉牛尾巴（打一字）','告',['舌','牢','吉'],'「牛」去掉下面那段尾巴，下面再加一個「口」，就是「告」。'],
 ['z',2,'一加一不是二（打一字）','王',['土','干','三'],'「一」加上加號「十」，再加一個「一」，疊起來就是「王」。'],
 ['z',2,'十張口，一顆心（打一字）','思',['恩','忠','怎'],'「十」和「口」合成「田」，下面一顆「心」，就是「思」。'],
 ['z',2,'千里相逢（打一字）','重',['野','埋','量'],'「千」和「里」上下合在一起，就是「重」。'],
 ['z',2,'十個哥哥（打一字）','克',['兄','古','競'],'「十」加上哥哥的「兄」，就是「克」。'],
 ['z',2,'牛走過獨木橋（打一字）','生',['先','牢','告'],'「牛」下面加一根木頭「一」，就是「生」。'],
 ['z',2,'九點（打一字）','丸',['旭','究','凡'],'「九」再加一點，就是「丸」。'],

const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
const stars = n => '★'.repeat(n);
const isChar = q => q.t === 'z';
let soundOn = store.get('bt-sound', true) !== false;
let AC = null;
function beep(kind){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime;
    const notes = kind === 'ok' ? [660, 880] : kind === 'bad' ? [240, 190] : [520, 520, 390];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain(), st = t0 + i * 0.1;
      o.type = kind === 'bad' ? 'square' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(kind === 'bad' ? 0.04 : 0.15, st + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.13);
      o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st + 0.15);
    });
  }catch(e){}
}

/* ===== 出題：優先出還沒出過的題目 ===== */
function draw(pool, n){
  n = Math.min(n, pool.length);
  let seen = store.get('bt-seen', []);
  let fresh = pool.filter(q => !seen.includes(q.id));
  if(fresh.length < n){
    const ids = new Set(pool.map(q => q.id));
    const keep = shuffle(fresh);
    seen = seen.filter(id => !ids.has(id));
    store.set('bt-seen', seen);
    const rest = shuffle(pool.filter(q => !keep.includes(q)));
    return keep.concat(rest).slice(0, n);
  }
  return shuffle(fresh).slice(0, n);
}
function markSeen(q){ const s = store.get('bt-seen', []); if(!s.includes(q.id)){ s.push(q.id); store.set('bt-seen', s); } }
function filterPool(type, lv){ return Q.filter(q => (type === 'all' || q.t === type) && (lv === 'all' || q.lv === lv)); }

function pills(id, list, key, after){
  const box = $('#' + id); box.innerHTML = '';
  list.forEach(([val, label]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pill'; b.textContent = label;
    b.setAttribute('aria-pressed', String(cfg[key] === val));
    b.addEventListener('click', () => {
      cfg[key] = val; saveCfg();
      Array.from(box.children).forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      if(after) after();
    });
    box.appendChild(b);
  });
}
const typeList = [['all','全部'],['z','字謎'],['l','邏輯'],['m','數學']];
pills('pSoloType', typeList, 'soloType', soloNote);
pills('pSoloLv', [['all','全部'],[1,'★'],[2,'★★'],[3,'★★★']], 'soloLv', soloNote);
pills('pFamN', [[2,'2 人'],[3,'3 人'],[4,'4 人']], 'famN', renderNames);
pills('pFamCount', [[10,'10 題'],[15,'15 題'],[20,'20 題']], 'famCount');
pills('pFamType', typeList, 'famType');
pills('pFamTimer', [[0,'不計時'],[30,'30 秒'],[60,'60 秒']], 'famTimer');
function soloNote(){
  const n = filterPool(cfg.soloType, cfg.soloLv).length, st = store.get('bt-stats', {done:0, right:0});
  $('#soloStart').textContent = '開始挑戰（' + Math.min(10, n) + ' 題）';
  $('#soloNote').textContent = '這個範圍有 ' + n + ' 題・累積答過 ' + st.done + ' 題，答對 ' + st.right + ' 題';
}
function renderNames(){
  const box = $('#names'); box.innerHTML = '';
  for(let i = 0; i < cfg.famN; i++){
    const lb = document.createElement('label'); lb.textContent = '第 ' + (i + 1) + ' 位';
    const inp = document.createElement('input'); inp.type = 'text'; inp.id = 'name' + i; inp.maxLength = 8; inp.value = names[i] || ('玩家' + (i + 1));
    inp.addEventListener('input', () => { names[i] = inp.value.trim() || ('玩家' + (i + 1)); store.set('bt-names', names); });
    lb.appendChild(inp); box.appendChild(lb);
  }
}
function setTab(fam){
  $('#tabSolo').setAttribute('aria-selected', String(!fam)); $('#tabFam').setAttribute('aria-selected', String(fam));
  $('#soloSet').hidden = fam; $('#famSet').hidden = !fam;
  store.set('bt-tab', fam ? 'fam' : 'solo');
}
$('#tabSolo').addEventListener('click', () => setTab(false));
$('#tabFam').addEventListener('click', () => setTab(true));
function renderBank(){
  let h = '';
  Object.keys(TYPES).forEach(t => {
    const list = Q.filter(q => q.t === t);
    h += '<h3>' + TYPES[t].name + '（' + list.length + ' 題）</h3><ol>';
    list.forEach(q => { h += '<li><span class="lvs">' + stars(q.lv) + '</span>' + q.q + '<br><span class="ans">答案：' + q.a + '</span></li>'; });
    h += '</ol>';
  });
  $('#bankBody').innerHTML = h;
  $('#total').textContent = Q.length;
}

/* ===== 畫面 ===== */
function show(id){ ['home','solo','fam','res'].forEach(s => { $('#' + s).hidden = s !== id; }); window.scrollTo(0, 0); }
function goHome(){ stopTimer(); soloNote(); $('#soundBtn').textContent = '音效：' + (soundOn ? '開' : '關'); show('home'); }
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', goHome));
function fillCard(prefix, q){
  const tag = $('#' + prefix + 'Tag'); tag.className = 'tag ' + q.t; tag.textContent = TYPES[q.t].name;
  $('#' + prefix + 'Lv').textContent = stars(q.lv);
  $('#' + prefix + 'Q').textContent = q.q;
}
function fillAnswer(prefix, q){
  const tz = $('#' + prefix + 'Tz'); tz.hidden = !isChar(q); if(isChar(q)) tz.textContent = q.a;
}

/* ===== 自己挑戰 ===== */
let G = null;
function startSolo(){
  const qs = draw(filterPool(cfg.soloType, cfg.soloLv), 10);
  G = {kind:'solo', qs, i:0, right:0, wrong:[], answered:false};
  show('solo'); renderSolo();
}
function renderSolo(){
  const q = G.qs[G.i]; G.answered = false; markSeen(q);
  $('#sNo').textContent = G.i + 1; $('#sTot').textContent = G.qs.length; $('#sRight').textContent = G.right;
  $('#sBar').style.width = (G.i / G.qs.length * 100) + '%';
  fillCard('s', q);
  const opts = shuffle([q.a].concat(q.d));
  const box = $('#sOpts');
  const short = opts.every(o => o.length <= 6);
  box.className = 'opts' + (short ? ' two' : '');
  box.innerHTML = '';
  opts.forEach((o, k) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'opt' + (isChar(q) ? ' char' : ''); b.dataset.v = o;
    b.innerHTML = '<span class="k" aria-hidden="true">' + (k + 1) + '</span><span class="t"></span>';
    b.querySelector('.t').textContent = o;
    b.addEventListener('click', () => answerSolo(b));
    box.appendChild(b);
  });
  $('#sRev').hidden = true;
}
function answerSolo(b){
  if(G.answered) return; G.answered = true;
  const q = G.qs[G.i], ok = b.dataset.v === q.a;
  Array.from($('#sOpts').children).forEach(x => { x.disabled = true; if(x.dataset.v === q.a) x.classList.add('ok'); });
  if(ok) G.right++; else { b.classList.add('bad'); G.wrong.push(q); }
  const st = store.get('bt-stats', {done:0, right:0}); st.done++; if(ok) st.right++; store.set('bt-stats', st);
  beep(ok ? 'ok' : 'bad');
  $('#sRight').textContent = G.right;
  const v = $('#sVerdict');
  v.className = 'verdict ' + (ok ? 'ok' : 'bad');
  v.innerHTML = (ok ? '答對了！' : '上當了！') + '答案是 <span class="ans"></span>';
  v.querySelector('.ans').textContent = '「' + q.a + '」';
  fillAnswer('s', q);
  $('#sExp').textContent = q.e;
  $('#sNext').textContent = G.i === G.qs.length - 1 ? '看成績' : '下一題';
  $('#sRev').hidden = false;
  $('#sBar').style.width = ((G.i + 1) / G.qs.length * 100) + '%';
  $('#sNext').focus({preventScroll:true});
  $('#sRev').scrollIntoView({block:'nearest', behavior:'smooth'});
}
$('#sNext').addEventListener('click', () => { if(G.i < G.qs.length - 1){ G.i++; renderSolo(); window.scrollTo(0, 0); } else finishSolo(); });
document.addEventListener('keydown', e => {
  if($('#solo').hidden || !G || G.kind !== 'solo' || G.answered) return;
  if(/^[1-4]$/.test(e.key)){ const b = $('#sOpts').children[+e.key - 1]; if(b) answerSolo(b); }
});
function finishSolo(){
  const n = G.qs.length;
  $('#rTitle').textContent = '自己挑戰・成績';
  $('#rBig').innerHTML = G.right + '<small>/ ' + n + ' 題</small>';
  const p = G.right / n;
  $('#rLine').textContent = p === 1 ? '全部答對，一題都沒上當。' : p >= 0.7 ? '大部分都識破了，看看下面上當的題目。' : '急轉彎就是要多看幾次才會習慣，下面是這次上當的題目。';
  $('#rRank').hidden = true;
  const list = $('#rList'); list.innerHTML = '';
  G.wrong.forEach(q => { const li = document.createElement('li'); li.innerHTML = '<span></span><br><b></b>'; li.querySelector('span').textContent = q.q; li.querySelector('b').textContent = '答案：' + q.a; list.appendChild(li); });
  $('#rListTitle').textContent = G.wrong.length ? '上當的題目（' + G.wrong.length + ' 題）' : '這次沒有上當的題目';
  $('#rPanel').hidden = !G.wrong.length;
  show('res');
}

/* ===== 全家搶答 ===== */
let timerId = 0, timeEnd = 0, timeLeft = 0;
function startFam(){
  const qs = draw(filterPool(cfg.famType, 'all'), cfg.famCount);
  const players = [];
  for(let i = 0; i < cfg.famN; i++){ const inp = $('#name' + i); players.push({name:(inp && inp.value.trim()) || names[i] || ('玩家' + (i + 1)), score:0}); }
  G = {kind:'fam', qs, i:0, players, revealed:false};
  $('#fTot').textContent = qs.length;
  show('fam'); renderScores(); renderFam();
}
function renderScores(bumpIdx){
  const box = $('#fScores'); box.style.setProperty('--n', G.players.length); box.innerHTML = '';
  const top = Math.max.apply(null, G.players.map(p => p.score));
  G.players.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'sc' + (top > 0 && p.score === top ? ' lead' : '') + (i === bumpIdx ? ' bump' : '');
    d.innerHTML = '<span class="nm"></span><b></b>'; d.querySelector('.nm').textContent = p.name; d.querySelector('b').textContent = p.score;
    box.appendChild(d);
  });
}
function renderFam(){
  const q = G.qs[G.i]; G.revealed = false; markSeen(q);
  $('#fNo').textContent = G.i + 1;
  fillCard('f', q);
  $('#fPts').textContent = '這題 ' + q.lv + ' 分';
  $('#fReveal').hidden = false; $('#fRev').hidden = true;
  startTimer();
}
function startTimer(){
  stopTimer();
  const tm = $('#fTimer');
  if(!cfg.famTimer){ tm.hidden = true; return; }
  tm.hidden = false; tm.classList.remove('low', 'up');
  timeEnd = Date.now() + cfg.famTimer * 1000;
  tick(); timerId = setInterval(tick, 100);
}
function tick(){
  timeLeft = Math.max(0, timeEnd - Date.now());
  const tm = $('#fTimer'), sec = Math.ceil(timeLeft / 1000);
  $('#fTimeBar').style.width = (timeLeft / (cfg.famTimer * 1000) * 100) + '%';
  $('#fTimeTxt').textContent = timeLeft > 0 ? '還剩 ' + sec + ' 秒' : '時間到！可以看答案了';
  tm.classList.toggle('low', timeLeft > 0 && sec <= 10);
  if(timeLeft <= 0){ tm.classList.add('up'); stopTimer(); beep('time'); }
}
function stopTimer(){ clearInterval(timerId); timerId = 0; }
$('#fReveal').addEventListener('click', () => {
  if(!G || G.revealed) return; G.revealed = true; stopTimer();
  const q = G.qs[G.i];
  $('#fAns').textContent = '答案：' + q.a;
  fillAnswer('f', q);
  $('#fExp').textContent = q.e;
  const who = $('#fWho'); who.innerHTML = '';
  G.players.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = p.name + ' +' + q.lv;
    b.addEventListener('click', () => award(i)); who.appendChild(b);
  });
  const none = document.createElement('button'); none.type = 'button'; none.className = 'none'; none.textContent = '沒人答對';
  none.addEventListener('click', () => award(-1)); who.appendChild(none);
  $('#fReveal').hidden = true; $('#fRev').hidden = false;
  $('#fRev').scrollIntoView({block:'nearest', behavior:'smooth'});
});
function award(i){
  const q = G.qs[G.i];
  if(i >= 0){ G.players[i].score += q.lv; beep('ok'); }
  renderScores(i);
  if(G.i < G.qs.length - 1){ G.i++; renderFam(); window.scrollTo(0, 0); } else finishFam();
}
function finishFam(){
  stopTimer();
  const ranked = G.players.slice().sort((a, b) => b.score - a.score);
  const top = ranked[0].score, winners = ranked.filter(p => p.score === top);
  $('#rTitle').textContent = '全家搶答・結果';
  $('#rBig').textContent = top > 0 ? (winners.length > 1 ? '平手！' : '冠軍') : '這輪沒人得分';
  $('#rLine').textContent = top > 0 ? winners.map(p => p.name).join('、') + '　' + top + ' 分' : '換一批題目再試試。';
  const rk = $('#rRank'); rk.hidden = false; rk.innerHTML = '';
  let pos = 0, last = null;
  ranked.forEach((p, idx) => {
    if(p.score !== last){ pos = idx + 1; last = p.score; }
    const li = document.createElement('li'); li.innerHTML = '<span class="pos"></span><span class="nm"></span><b></b>';
    li.querySelector('.pos').textContent = pos; li.querySelector('.nm').textContent = p.name; li.querySelector('b').textContent = p.score + ' 分';
    rk.appendChild(li);
  });
  $('#rList').innerHTML = '';
  $('#rListTitle').textContent = '排名';
  $('#rPanel').hidden = false;
  beep('ok');
  show('res');
}

/* ===== 按鈕 ===== */
$('#soloStart').addEventListener('click', startSolo);
$('#famStart').addEventListener('click', startFam);
$('#rAgain').addEventListener('click', () => { if(G && G.kind === 'fam') startFam(); else startSolo(); });
$('#soundBtn').addEventListener('click', () => { soundOn = !soundOn; store.set('bt-sound', soundOn); $('#soundBtn').textContent = '音效：' + (soundOn ? '開' : '關'); });

renderBank(); renderNames(); setTab(store.get('bt-tab', 'solo') === 'fam'); goHome();
})();
</script>
</body>
</html>
