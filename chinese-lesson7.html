<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>為生命找出口闖關</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, a "flight route" of four stations on the home screen; quiz cards borrow the textbook's red 生字格 and yellow highlighter. */
:root{
  --bg:#edf3f7; --card:#ffffff; --soft:#f3f7fa; --ink:#15304a; --muted:#587086; --line:#cfdde7;
  --accent:#1d6aa8; --accent-soft:#e1eef8; --on-accent:#ffffff;
  --hl:#ffe14d; --pen:#d2362c; --pen-soft:#eaa7a1;
  --ok:#23845a; --okbg:#e2f3ea; --badbg:#fbe7e5; --gold:#e3a51a;
  --kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1923; --card:#152433; --soft:#112030; --ink:#e4edf5; --muted:#93a8ba; --line:#284055;
    --accent:#6db2ea; --accent-soft:#1b3550; --on-accent:#0b1a27;
    --hl:rgba(214,178,40,.55); --pen:#ff7366; --pen-soft:#7a3a35;
    --ok:#5ccc90; --okbg:#143327; --badbg:#3a1c1a; --gold:#f1bf3d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1923; --card:#152433; --soft:#112030; --ink:#e4edf5; --muted:#93a8ba; --line:#284055;
  --accent:#6db2ea; --accent-soft:#1b3550; --on-accent:#0b1a27;
  --hl:rgba(214,178,40,.55); --pen:#ff7366; --pen-soft:#7a3a35;
  --ok:#5ccc90; --okbg:#143327; --badbg:#3a1c1a; --gold:#f1bf3d;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.65;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 48px;
}
.app{max-width:600px; margin:0 auto}
button{font:inherit; color:inherit}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ---------- home ---------- */
.hero{position:relative; padding-block:6px 4px}
.wind{position:absolute; right:-4px; top:0; width:130px; height:auto; color:var(--accent); pointer-events:none}
.wind .streak{opacity:.35}
.eyebrow{margin:0; font-size:13px; letter-spacing:.14em; color:var(--muted); font-weight:500}
h1{font-family:var(--kai); font-weight:700; font-size:clamp(38px, 11vw, 54px); line-height:1.15; margin:6px 0 4px; text-wrap:balance; position:relative}
.byline{margin:0; color:var(--muted); font-size:15px}
.lead{margin:18px 0 18px; font-size:16px}
.route{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; position:relative}
.route::before{content:""; position:absolute; left:33px; top:30px; bottom:30px; border-left:2px dashed var(--accent); opacity:.45}
.stop button{
  width:100%; display:grid; grid-template-columns:68px minmax(0,1fr) auto; align-items:center;
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:14px 16px 14px 0; text-align:left; cursor:pointer; position:relative;
  transition:border-color .15s, transform .15s;
}
.stop button:hover{border-color:var(--accent)}
.stop button:active{transform:scale(.99)}
.badge{justify-self:center; width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  background:var(--accent-soft); color:var(--accent); font-family:var(--kai); font-weight:700; font-size:22px; border:2px solid var(--accent)}
.nm{display:block; font-family:var(--kai); font-weight:700; font-size:22px; line-height:1.3}
.nm em{font-style:normal; font-family:var(--sans); font-size:13px; font-weight:500; color:var(--accent); background:var(--accent-soft); padding:2px 8px; border-radius:99px; margin-left:6px; vertical-align:3px}
.ds{display:block; font-size:14px; color:var(--muted)}
.stars{font-size:18px; letter-spacing:1px; white-space:nowrap}
.stars i{font-style:normal; color:var(--line)}
.stars i.on{color:var(--gold)}
.extra{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px}
.extra .btn{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:14px 16px}
.extra .btn small{font-size:13px; font-weight:400; opacity:.85}
.foot{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-top:22px; font-size:13px; color:var(--muted)}
a.chip{text-decoration:none}
.chip{appearance:none; border:1px solid var(--line); background:var(--card); border-radius:99px; padding:4px 12px; font-size:13px; cursor:pointer; color:var(--muted)}

/* ---------- buttons ---------- */
.btn{appearance:none; border:0; border-radius:12px; padding:13px 18px; font-size:17px; font-weight:700;
  background:var(--accent); color:var(--on-accent); cursor:pointer; transition:filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--card); color:var(--ink); border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent); filter:none}
.btn.full{width:100%}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}

/* ---------- quiz ---------- */
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px}
.back{appearance:none; border:0; background:none; color:var(--accent); font-weight:700; cursor:pointer; padding:6px 0; font-size:15px; white-space:nowrap}
.ttl{font-family:var(--kai); font-weight:700; font-size:19px; text-align:center; flex:1; min-width:0}
.score{font-variant-numeric:tabular-nums; white-space:nowrap; font-size:15px}
.score b{font-size:20px}
.progress{height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin-top:10px}
.progress i{display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .35s ease}
.meta{display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; min-height:26px}
.streak{color:var(--gold); font-weight:700}
.qcard{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 18px; margin-top:10px}
.prompt{margin:0; font-size:18px; font-weight:500; line-height:1.55}
.gbox{width:104px; height:104px; margin:16px auto 6px; border:2px solid var(--pen); position:relative; display:grid; place-items:center; background:var(--card)}
.gbox::before,.gbox::after{content:""; position:absolute; inset:0; margin:auto}
.gbox::before{width:100%; height:0; border-top:1.5px dashed var(--pen-soft)}
.gbox::after{height:100%; width:0; border-left:1.5px dashed var(--pen-soft)}
.gbox span{position:relative; z-index:1; font-family:var(--kai); font-size:72px; line-height:1; color:var(--pen)}
.ctx{margin:10px 0 0; font-family:var(--kai); font-size:25px; line-height:1.6; text-align:center; text-wrap:balance}
.ctx.small{font-size:20px; text-align:left; background:var(--soft); border-radius:10px; padding:10px 14px}
mark{background:linear-gradient(transparent 52%, var(--hl) 52%); color:inherit; padding:0 2px}
.blank{display:inline-block; width:1.25em; height:1.25em; border:2px dashed var(--accent); border-radius:6px; vertical-align:-.22em; margin:0 3px}
.opts{display:grid; gap:10px; margin-top:18px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{appearance:none; min-height:58px; padding:12px 14px; border:2px solid var(--line); background:var(--card);
  border-radius:12px; font-size:17px; line-height:1.45; text-align:left; cursor:pointer; display:flex; gap:12px; align-items:center;
  transition:border-color .15s, background .15s}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt .k{flex:none; width:22px; height:22px; border:1px solid var(--line); border-radius:6px; display:grid; place-items:center; font-size:12px; color:var(--muted)}
.opt .t{min-width:0}
.opt.zy .t{font-size:26px; letter-spacing:2px}
.opt.char .t{font-family:var(--kai); font-size:32px; font-weight:700}
.opt.zy,.opt.char{justify-content:center; position:relative}
.opt.zy .k,.opt.char .k{position:absolute; left:10px; top:10px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok); background:var(--okbg)}
.opt.bad{border-color:var(--pen); background:var(--badbg)}
.opt.ok .k{border-color:var(--ok); color:var(--ok)}
.opt.bad .k{border-color:var(--pen); color:var(--pen)}
.fb{margin-top:16px; padding:14px 16px 16px; border-radius:12px; background:var(--soft); display:flex; flex-direction:column; gap:6px}
.fb p{margin:0}
.verdict{font-weight:700; font-size:17px}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--pen)}
.src{font-size:13px; color:var(--muted)}
.fb .btn{margin-top:8px}

/* ---------- match ---------- */
.hint{margin:12px 0 0; font-size:14px; color:var(--muted)}
.mgrid{display:grid; grid-template-columns:minmax(0,2fr) minmax(0,3fr); gap:10px; margin-top:12px}
.tile{appearance:none; min-height:62px; border:2px solid var(--line); background:var(--card); border-radius:12px;
  padding:10px 12px; font-size:15px; line-height:1.45; text-align:left; cursor:pointer; transition:border-color .15s, background .15s, opacity .2s}
.tile.w{font-family:var(--kai); font-weight:700; font-size:20px; text-align:center}
.tile:not(.done):hover{border-color:var(--accent)}
.tile.sel{border-color:var(--accent); background:var(--accent-soft)}
.tile.done{border-color:var(--ok); background:var(--okbg); opacity:.7; cursor:default}
.tile.shake{animation:shake .36s; border-color:var(--pen)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- result & book ---------- */
.result{text-align:center; padding-top:10px}
.result h2,.book h2{font-family:var(--kai); font-size:28px; margin:0}
.bigscore{font-family:var(--kai); font-weight:700; font-size:68px; line-height:1.1; margin:10px 0 0; font-variant-numeric:tabular-nums}
.bigscore small{font-size:22px}
.result .stars{font-size:40px; letter-spacing:6px; margin-top:4px}
.rline{margin:6px 0 0; font-size:17px}
.rmsg{margin:4px 0 0; color:var(--muted)}
.wlist{list-style:none; margin:20px 0 0; padding:0; text-align:left; display:flex; flex-direction:column; gap:8px}
.wlist li{background:var(--card); border:1px solid var(--line); border-left:4px solid var(--pen); border-radius:10px; padding:10px 14px; display:flex; flex-direction:column; gap:2px}
.wl{font-size:15px}
.wa{font-size:15px; color:var(--ok); font-weight:700}
.wlist-title{margin:22px 0 0; text-align:left; font-weight:700}
.actions{display:grid; gap:10px; margin-top:22px}
.book .empty{background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--muted); margin-top:16px}
.confirm{display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:var(--badbg); border-radius:12px; padding:12px 14px}
.confirm p{margin:0; flex:1 1 160px}

@media (max-width:380px){
  .extra{grid-template-columns:1fr}
  .opt.zy .t{font-size:23px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important; transition:none!important}
}
</style>
</head>
<body>
<div class="app" lang="zh-Hant">

  <section id="home">
    <header class="hero">
      <svg class="wind" viewBox="0 0 160 120" aria-hidden="true">
        <g class="streak" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M8 40 C48 30, 86 50, 128 36"/>
          <path d="M26 66 C66 56, 102 76, 152 62"/>
          <path d="M4 92 C44 82, 80 102, 118 88"/>
        </g>
        <path transform="translate(104 2) rotate(58 12 12) scale(1.7)" fill="currentColor" d="M12 1.5c.8 0 1.4 1 1.4 2.4V9l8.1 4.6v2.1l-8.1-2.5v5.2l2.2 1.7V22L12 21l-3.6 1v-1.9l2.2-1.7v-5.2l-8.1 2.5v-2.1L10.6 9V3.9c0-1.4.6-2.4 1.4-2.4z"/>
      </svg>
      <p class="eyebrow">五年級國語・第七課</p>
      <h1>為生命找出口</h1>
      <p class="byline">改寫自劉俠〈生之歌〉</p>
    </header>
    <p class="lead">照順序一關一關往上飛。答錯的題目會自動收進錯題本。</p>
    <ol class="route" id="route"></ol>
    <div class="extra">
      <button class="btn" id="mixBtn" type="button">總複習<small>四關混合 20 題</small></button>
      <button class="btn ghost" id="bookBtn" type="button">錯題本<small id="bookCount">0 題</small></button>
    </div>
    <div class="foot">
      <a class="chip" href="index.html">← 五年級湊湊樂</a>
      <span>題目依課本第 82–86 頁整理</span>
      <button class="chip" id="soundBtn" type="button">音效：開</button>
    </div>
  </section>

  <section id="quiz" hidden>
    <div class="topbar">
      <button class="back" type="button" data-home>← 航線</button>
      <span class="ttl" id="qTitle"></span>
      <span class="score"><b id="qScore">0</b> 分</span>
    </div>
    <div class="progress"><i id="qBar"></i></div>
    <div class="meta"><span id="qCount"></span><span class="streak" id="qStreak"></span></div>
    <article class="qcard">
      <p class="prompt" id="qPrompt"></p>
      <div class="gbox" id="qBox" hidden><span></span></div>
      <p class="ctx" id="qCtx"></p>
      <div class="opts" id="qOpts"></div>
      <div class="fb" id="qFb" hidden>
        <p class="verdict" id="qVerdict"></p>
        <p class="exp" id="qExp"></p>
        <p class="src" id="qSrc"></p>
        <button class="btn full" id="qNext" type="button">下一題</button>
      </div>
    </article>
  </section>

  <section id="match" hidden>
    <div class="topbar">
      <button class="back" type="button" data-home>← 航線</button>
      <span class="ttl">蛛網連連看・語詞</span>
      <span class="score"><b id="mScore">0</b> 分</span>
    </div>
    <div class="progress"><i id="mBar"></i></div>
    <div class="meta"><span id="mCount"></span><span class="streak" id="mStreak"></span></div>
    <p class="hint">先點左邊的語詞，再點右邊的意思。連錯的語詞會收進錯題本。</p>
    <div class="mgrid" id="mGrid"></div>
    <div class="fb" id="mFb" hidden>
      <p class="verdict ok" id="mVerdict"></p>
      <button class="btn full" id="mNext" type="button">下一組</button>
    </div>
  </section>

  <section id="result" class="result" hidden>
    <h2 id="rTitle"></h2>
    <p class="bigscore"><span id="rScore">0</span><small> 分</small></p>
    <div class="stars" id="rStars"></div>
    <p class="rline" id="rLine"></p>
    <p class="rmsg" id="rMsg"></p>
    <p class="wlist-title" id="rWTitle" hidden>這次答錯的題目</p>
    <ul class="wlist" id="rList"></ul>
    <div class="actions">
      <button class="btn full" id="rAgain" type="button">再玩一次</button>
      <button class="btn ghost full" id="rBook" type="button">練錯題</button>
      <button class="btn ghost full" type="button" data-home>回航線</button>
    </div>
  </section>

  <section id="book" class="book" hidden>
    <div class="topbar">
      <button class="back" type="button" data-home>← 航線</button>
      <span class="ttl">錯題本</span>
      <span class="score"><b id="bCount">0</b> 題</span>
    </div>
    <div id="bEmpty" class="empty">目前沒有錯題。去闖關吧。</div>
    <div id="bBody">
      <ul class="wlist" id="bList"></ul>
      <div class="actions">
        <button class="btn full" id="bStart" type="button">開始重練（答對就移出錯題本）</button>
        <button class="btn ghost full" id="bClear" type="button">清空錯題本</button>
        <div class="confirm" id="bConfirm" hidden>
          <p>確定要清空全部錯題嗎？</p>
          <button class="btn" id="bYes" type="button">清空</button>
          <button class="btn ghost" id="bNo" type="button">取消</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";

/* ===== 題庫：全部取自課本第七課〈為生命找出口〉照片 ===== */

// 字音：[生字, 出處片語([]標出該字), 正確注音, [干擾], 解說, 段落]
const SOUND = [
 ['憐','可[憐]我這個……腦袋','ㄌㄧㄢˊ',['ㄌㄧㄣˊ','ㄌㄧㄢˇ','ㄌㄧㄤˊ'],'「憐」念ㄌㄧㄢˊ。別跟「鄰居」的「鄰」（ㄌㄧㄣˊ）念混。','第一段'],
 ['穩','飛得又平又[穩]','ㄨㄣˇ',['ㄨㄣˋ','ㄨㄥˇ','ㄧㄣˇ'],'「穩」念ㄨㄣˇ，三聲。','第一段'],
 ['逆','一路[逆]風','ㄋㄧˋ',['ㄌㄧˋ','ㄋㄧˇ','ㄋㄧˊ'],'「逆」念ㄋㄧˋ，聲母是ㄋ，不是ㄌ。','第一段'],
 ['競','物[競]天擇','ㄐㄧㄥˋ',['ㄐㄧㄥˇ','ㄐㄧㄣˋ','ㄑㄧㄥˋ'],'「競」念ㄐㄧㄥˋ，結尾是後鼻音ㄥ。','第二段'],
 ['峭','[峭]壁之上','ㄑㄧㄠˋ',['ㄒㄧㄠˋ','ㄑㄧㄠˇ','ㄑㄧㄠ'],'「峭」念ㄑㄧㄠˋ。峭壁就是又高又陡的山壁。','第二段'],
 ['抗','[抗]著強風','ㄎㄤˋ',['ㄎㄤ','ㄎㄤˇ','ㄏㄤˊ'],'「抗」念ㄎㄤˋ，四聲。','第三段'],
 ['逸','好[逸]惡勞','ㄧˋ',['ㄧˊ','ㄧˇ','ㄇㄧㄢˇ'],'「逸」念ㄧˋ。它長得像「免」，讀音完全不同。','第四段'],
 ['好','[好]逸惡勞','ㄏㄠˋ',['ㄏㄠˇ','ㄏㄠ','ㄏㄠˊ'],'破音字。這裡的「好」是「喜歡」的意思，念ㄏㄠˋ；「好人」的好才念ㄏㄠˇ。','第四段'],
 ['惡','好逸[惡]勞','ㄨˋ',['ㄜˋ','ㄜˇ','ㄨˊ'],'破音字。這裡的「惡」是「討厭」的意思，念ㄨˋ；「惡劣」的惡才念ㄜˋ。','第四段'],
 ['鄰','來了一位新[鄰]居','ㄌㄧㄣˊ',['ㄌㄧㄢˊ','ㄌㄧㄥˊ','ㄌㄧㄣˇ'],'「鄰」念ㄌㄧㄣˊ，前鼻音ㄣ。別跟「可憐」的「憐」（ㄌㄧㄢˊ）念混。','小蜘蛛・第一段'],
 ['脈','[脈]絡分明','ㄇㄞˋ',['ㄇㄞˇ','ㄇㄟˋ','ㄇㄚˋ'],'「脈絡」的「脈」念ㄇㄞˋ。','小蜘蛛・第二段'],
 ['絡','脈[絡]分明','ㄌㄨㄛˋ',['ㄌㄨㄛˊ','ㄌㄨˋ','ㄍㄜˊ'],'「絡」念ㄌㄨㄛˋ。','小蜘蛛・第二段'],
 ['緻','小巧精[緻]','ㄓˋ',['ㄓˇ','ㄗˋ','ㄓ'],'「緻」念ㄓˋ，翹舌音、四聲。','小蜘蛛・第二段'],

function vocabQ(v){
  const others = shuffle(VOCAB.filter(x=>x[0]!==v[0])).slice(0,3).map(x=>x[1]);
  return {id:'v:'+v[0], lv:'vocab', kind:'long', p:'「'+v[0]+'」是什麼意思？', c:'', o:[v[1]].concat(others), e:v[0]+'：'+v[1], s:v[2]};
}
function getQ(id){
  if(id.indexOf('v:')===0){ const v=VOCAB.find(x=>x[0]===id.slice(2)); return v? vocabQ(v) : null; }
  return BANK[id] || null;
}

const $ = s=>document.querySelector(s);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a,n){ return shuffle(a).slice(0,n); }
function fmt(s){ return s.replace(/\[(.+?)\]/g,'<mark>$1</mark>').replace(/＿/g,'<span class="blank" aria-label="空格"></span>'); }
function plain(s){ return s.replace(/[\[\]]/g,''); }
function label(q){
  if(q.lv==='sound') return '「'+plain(q.c)+'」的「'+q.big+'」';
  if(q.lv==='shape') return q.c.replace(/＿/g,'（　）');
  if(q.lv==='vocab') return '「'+q.id.slice(2)+'」的意思';
  return q.p + (q.c ? '　'+q.c.replace(/＿/g,'（　）') : '');
}
function starsFor(p){ return p>=0.9?3 : p>=0.7?2 : p>=0.5?1 : 0; }
function starHTML(n){ let h=''; for(let i=0;i<3;i++) h+='<i class="'+(i<n?'on':'')+'">★</i>'; return h; }
const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// 題庫輪替：同一台裝置上，題庫裡每一題都出過一次以後才會重複（記在瀏覽器）
function Deck(key, ids){
  const all = ids.map(String), valid = new Set(all);
  const st = store.get(key, null) || {};
  let seen = new Set((st.s || []).filter(x => valid.has(x))), next = new Set((st.n || []).filter(x => valid.has(x)));
  if(seen.size >= all.length){ seen = next; next = new Set(); }
  const save = () => store.set(key, {s:Array.from(seen), n:Array.from(next)});
  return {
    // 先從還沒出過的題目抽；不夠時才從已出過的補，並避開新一輪已出過的
    draw(n, ok){
      const out = [];
      const take = list => { for(const x of shuffle(list)){ if(out.length >= n) return; if(out.includes(x) || (ok && !ok(x, out))) continue; out.push(x); } };
      take(all.filter(x => !seen.has(x)));
      if(out.length < n) take(all.filter(x => !next.has(x)));
      if(out.length < n) take(all);
      return out;
    },
    mark(id){
      id = String(id); if(!valid.has(id)) return;
      if(!seen.has(id)) seen.add(id); else next.add(id);
      if(seen.size >= all.length){ seen = next; next = new Set(); }
      save();
    },
    left(){ return all.filter(x => !seen.has(x)).length; }
  };
}
// 沒有固定題庫、由程式產生的題目：記住出過的，不再出（記滿 cap 筆就丟掉最舊的）
function SeenSet(key, cap){
  let arr = store.get(key, []) || [], set = new Set(arr);
  return {
    has(k){ return set.has(k); },
    add(k){ if(set.has(k)) return; arr.push(k); if(arr.length > cap) arr = arr.slice(-cap); set = new Set(arr); store.set(key, arr); },
    reset(){ arr = []; set = new Set(); store.set(key, arr); }
  };
}
const DECK = {
  sound:Deck('l7r-d-sound', byLv.sound.map(q=>q.id)),
  shape:Deck('l7r-d-shape', byLv.shape.map(q=>q.id)),
  text:Deck('l7r-d-text', byLv.text.map(q=>q.id)),
  vocabMix:Deck('l7r-d-vocab-mix', VOCAB.map(v=>v[0])),
  vocabMatch:Deck('l7r-d-vocab-match', VOCAB.map(v=>v[0]))
};
const drawLv = (lv, n) => DECK[lv].draw(n).map(id => BANK[id]);
const drawVocab = (deck, n) => deck.draw(n).map(w => VOCAB.find(v => v[0] === w));
const K = {wrong:'l7r-wrong', best:'l7r-best', sound:'l7r-sound'};
let wrong = new Set(store.get(K.wrong, []).filter(id=>getQ(id)));
let best = store.get(K.best, {}) || {};
let soundOn = store.get(K.sound, true) !== false;
function saveWrong(){ store.set(K.wrong, Array.from(wrong)); }

let AC = null;
function beep(ok){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime, notes = ok ? [660, 880] : [240, 190];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(), g=AC.createGain(), st=t+i*0.09;
      o.type = ok ? 'triangle' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(ok?0.16:0.05, st+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, st+0.13);
      o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st+0.15);
    });
  }catch(e){}
}

/* ===== 畫面切換 ===== */
const SCREENS = ['home','quiz','match','result','book'];
function show(id){ SCREENS.forEach(s=>{ $('#'+s).hidden = (s!==id); }); window.scrollTo(0,0); }
function modeTitle(m){ return LV[m] ? LV[m].name+'・'+LV[m].tag : m==='mix' ? '總複習' : '錯題重練'; }

function renderHome(){
  const ol = $('#route'); ol.innerHTML='';
  Object.keys(LV).forEach(k=>{
    const L = LV[k];
    const li = document.createElement('li'); li.className='stop';
    const per = k==='match' ? '每次 3 組共 15 個' : '每次 '+L.n+' 題';
    li.innerHTML = '<button type="button"><span class="badge" aria-hidden="true">'+L.badge+'</span>'+
      '<span><span class="nm">'+L.name+'<em>'+L.tag+'</em></span><span class="ds">'+L.desc+'・題庫 '+L.bank+'・'+per+'</span></span>'+
      '<span class="stars" aria-label="最佳 '+(best[k]||0)+' 顆星">'+starHTML(best[k]||0)+'</span></button>';
    li.querySelector('button').addEventListener('click', ()=> k==='match' ? startMatch() : startQuiz(k));
    ol.appendChild(li);
  });
  $('#bookCount').textContent = wrong.size ? wrong.size+' 題待練' : '目前沒有錯題';
  $('#soundBtn').textContent = '音效：'+(soundOn?'開':'關');
  show('home');
}

/* ===== 選擇題 ===== */
let G = null;
function startQuiz(mode){
  let qs;
  if(mode==='mix'){
    qs = shuffle([].concat(drawLv('sound',5), drawLv('shape',5), drawVocab(DECK.vocabMix,5).map(vocabQ), drawLv('text',5)));
  }else if(mode==='wrong'){
    qs = shuffle(Array.from(wrong).map(getQ).filter(Boolean)).slice(0,20);
    if(!qs.length){ renderBook(); return; }
  }else{
    qs = drawLv(mode, LV[mode].n);
  }
  G = {mode:mode, qs:qs, i:0, score:0, streak:0, right:0, misses:[], cleared:0, answered:false};
  show('quiz'); renderQ();
}
function setStreak(el, n){ el.textContent = n>=3 ? '連對 '+n+' 題・每題加 5 分' : n>=2 ? '連對 '+n+' 題' : ''; }
function renderQ(){
  const q = G.qs[G.i]; G.answered = false;
  // 錯題重練是刻意重複，不算進題庫輪替
  if(G.mode !== 'wrong'){ if(q.lv === 'vocab') DECK.vocabMix.mark(q.id.slice(2)); else DECK[q.lv].mark(q.id); }
  $('#qTitle').textContent = modeTitle(G.mode);
  $('#qCount').textContent = '第 '+(G.i+1)+' / '+G.qs.length+' 題';
  $('#qBar').style.width = (G.i/G.qs.length*100)+'%';
  $('#qScore').textContent = G.score;
  setStreak($('#qStreak'), G.streak);
  $('#qPrompt').textContent = q.p;
  const box = $('#qBox'); box.hidden = !q.big; if(q.big) box.querySelector('span').textContent = q.big;
  const c = $('#qCtx'); c.hidden = !q.c; c.innerHTML = q.c ? fmt(q.c) : '';
  c.className = 'ctx' + (q.lv==='text' ? ' small' : '');
  const wrap = $('#qOpts'); wrap.className = 'opts ' + (q.kind==='long' ? 'one' : 'two'); wrap.innerHTML = '';
  shuffle(q.o).forEach((t,k)=>{
    const b = document.createElement('button'); b.type='button'; b.className='opt '+q.kind; b.dataset.v=t;
    b.innerHTML = '<span class="k" aria-hidden="true">'+(k+1)+'</span><span class="t"></span>';
    b.querySelector('.t').textContent = t;
    b.addEventListener('click', ()=>answer(b));
    wrap.appendChild(b);
  });
  $('#qFb').hidden = true;
}
function answer(b){
  if(G.answered) return; G.answered = true;
  const q = G.qs[G.i], ans = q.o[0], ok = b.dataset.v===ans;
  Array.from($('#qOpts').children).forEach(x=>{ x.disabled=true; if(x.dataset.v===ans) x.classList.add('ok'); });
  let bonus = 0;
  if(ok){
    G.right++; G.streak++; bonus = G.streak>=3 ? 5 : 0; G.score += 10 + bonus;
    if(G.mode==='wrong' && wrong.has(q.id)){ wrong.delete(q.id); G.cleared++; saveWrong(); }
  }else{
    b.classList.add('bad'); G.streak = 0;
    G.misses.push({l:label(q), a:ans}); wrong.add(q.id); saveWrong();
  }
  beep(ok);
  $('#qScore').textContent = G.score;
  setStreak($('#qStreak'), G.streak);
  const v = $('#qVerdict');
  v.className = 'verdict ' + (ok?'ok':'bad');
  v.textContent = ok ? (bonus ? '答對了！連對加 5 分' : '答對了！') : '正確答案是「'+ans+'」';
  $('#qExp').textContent = q.e;
  $('#qSrc').textContent = '出處：' + q.s;
  const last = G.i===G.qs.length-1;
  $('#qNext').textContent = last ? '看成績' : '下一題';
  $('#qFb').hidden = false;
  $('#qBar').style.width = ((G.i+1)/G.qs.length*100)+'%';
  $('#qNext').focus({preventScroll:true});
  $('#qFb').scrollIntoView({block:'nearest', behavior: reduced ? 'auto' : 'smooth'});
}
$('#qNext').addEventListener('click', ()=>{ if(G.i < G.qs.length-1){ G.i++; renderQ(); window.scrollTo(0,0); } else finish(G.qs.length); });

document.addEventListener('keydown', e=>{
  if($('#quiz').hidden || !G || G.answered) return;
  if(/^[1-4]$/.test(e.key)){ const b = $('#qOpts').children[+e.key-1]; if(b) answer(b); }
});

/* ===== 連連看 ===== */
function startMatch(){
  const w = drawVocab(DECK.vocabMatch, 15);
  G = {mode:'match', rounds:[w.slice(0,5), w.slice(5,10), w.slice(10,15)], r:0, score:0, streak:0, right:0, misses:[], missed:new Set(), sel:null, left:0};
  show('match'); renderRound();
}
function renderRound(){
  const set = G.rounds[G.r]; G.left = set.length; G.sel = null;
  set.forEach(v => DECK.vocabMatch.mark(v[0]));
  $('#mCount').textContent = '第 '+(G.r+1)+' / '+G.rounds.length+' 組';
  $('#mBar').style.width = (G.r/G.rounds.length*100)+'%';
  $('#mScore').textContent = G.score;
  setStreak($('#mStreak'), G.streak);
  const ms = shuffle(set), grid = $('#mGrid'); grid.innerHTML = '';
  for(let i=0;i<set.length;i++){
    grid.appendChild(makeTile('w', set[i][0], set[i][0]));
    grid.appendChild(makeTile('m', ms[i][0], ms[i][1]));
  }
  $('#mFb').hidden = true;
}
function makeTile(side, key, text){
  const b = document.createElement('button'); b.type='button'; b.className='tile '+side; b.dataset.side=side; b.dataset.w=key;
  b.textContent = text; b.setAttribute('aria-pressed','false');
  b.addEventListener('click', ()=>pickTile(b));
  return b;
}
function pickTile(t){
  if(t.classList.contains('done')) return;
  const s = G.sel;
  if(s === t){ t.classList.remove('sel'); t.setAttribute('aria-pressed','false'); G.sel=null; return; }
  if(!s || s.dataset.side===t.dataset.side){
    if(s){ s.classList.remove('sel'); s.setAttribute('aria-pressed','false'); }
    G.sel = t; t.classList.add('sel'); t.setAttribute('aria-pressed','true'); return;
  }
  s.classList.remove('sel'); s.setAttribute('aria-pressed','false'); G.sel = null;
  const w = s.dataset.side==='w' ? s : t, m = (w===s) ? t : s;
  if(w.dataset.w === m.dataset.w){
    [w,m].forEach(x=>{ x.classList.add('done'); x.disabled = true; });
    if(!G.missed.has(w.dataset.w)){ G.right++; G.streak++; G.score += 10 + (G.streak>=3?5:0); }
    beep(true); G.left--;
    $('#mScore').textContent = G.score; setStreak($('#mStreak'), G.streak);
    if(G.left===0) roundDone();
  }else{
    [w,m].forEach(x=>{ x.classList.remove('shake'); void x.offsetWidth; x.classList.add('shake'); setTimeout(()=>x.classList.remove('shake'), 400); });
    beep(false); G.streak = 0; setStreak($('#mStreak'), 0);
    const word = w.dataset.w;
    if(!G.missed.has(word)){
      G.missed.add(word);
      const v = VOCAB.find(x=>x[0]===word);
      G.misses.push({l:'「'+word+'」的意思', a:v[1]});
      wrong.add('v:'+word); saveWrong();
    }
  }
}
function roundDone(){
  const last = G.r === G.rounds.length-1;
  $('#mBar').style.width = ((G.r+1)/G.rounds.length*100)+'%';
  $('#mVerdict').textContent = '這組連完了！';
  $('#mNext').textContent = last ? '看成績' : '下一組';
  $('#mFb').hidden = false;
  $('#mNext').focus({preventScroll:true});
  $('#mFb').scrollIntoView({block:'nearest', behavior: reduced ? 'auto' : 'smooth'});
}
$('#mNext').addEventListener('click', ()=>{ if(G.r < G.rounds.length-1){ G.r++; renderRound(); window.scrollTo(0,0); } else finish(15); });

/* ===== 成績 ===== */
function finish(total){
  const p = G.right/total, st = starsFor(p);
  if(G.mode!=='wrong' && st > (best[G.mode]||0)){ best[G.mode] = st; store.set(K.best, best); }
  $('#rTitle').textContent = modeTitle(G.mode) + '・成績';
  $('#rScore').textContent = G.score;
  $('#rStars').innerHTML = starHTML(st);
  $('#rStars').setAttribute('aria-label', st+' 顆星');
  $('#rLine').textContent = G.mode==='match' ? '一次就連對 '+G.right+' / '+total+' 個' : '答對 '+G.right+' / '+total+' 題';
  let msg = p===1 ? '全部答對。' : p>=0.8 ? '只差一點，把下面的題目再看一次。' : p>=0.5 ? '錯的題目已收進錯題本，練到全對為止。' : '先回課本把課文讀一遍，再來挑戰。';
  if(G.mode==='wrong') msg = '這次清掉 '+G.cleared+' 題，錯題本還剩 '+wrong.size+' 題。';
  $('#rMsg').textContent = msg;
  const list = $('#rList'); list.innerHTML = '';
  G.misses.forEach(m=>{
    const li = document.createElement('li');
    li.innerHTML = '<span class="wl"></span><span class="wa"></span>';
    li.querySelector('.wl').textContent = m.l; li.querySelector('.wa').textContent = '答案：'+m.a;
    list.appendChild(li);
  });
  $('#rWTitle').hidden = !G.misses.length;
  $('#rBook').hidden = !wrong.size;
  $('#rBook').textContent = '練錯題（'+wrong.size+' 題）';
  show('result');
}
$('#rAgain').addEventListener('click', ()=>{ const m = G.mode; m==='match' ? startMatch() : startQuiz(m); });
$('#rBook').addEventListener('click', ()=>startQuiz('wrong'));

/* ===== 錯題本 ===== */
function renderBook(){
  const ids = Array.from(wrong);
  $('#bCount').textContent = ids.length;
  $('#bEmpty').hidden = !!ids.length;
  $('#bBody').hidden = !ids.length;
  $('#bConfirm').hidden = true; $('#bClear').hidden = false;
  const list = $('#bList'); list.innerHTML = '';
  ids.forEach(id=>{
    const q = getQ(id); if(!q) return;
    const li = document.createElement('li');
    li.innerHTML = '<span class="wl"></span><span class="wa"></span>';
    li.querySelector('.wl').textContent = label(q); li.querySelector('.wa').textContent = '答案：'+q.o[0];
    list.appendChild(li);
  });
  $('#bStart').textContent = '開始重練 '+Math.min(ids.length,20)+' 題（答對就移出錯題本）';
  show('book');
}
$('#bookBtn').addEventListener('click', renderBook);
$('#bStart').addEventListener('click', ()=>startQuiz('wrong'));
$('#bClear').addEventListener('click', ()=>{ $('#bConfirm').hidden=false; $('#bClear').hidden=true; $('#bNo').focus(); });
$('#bNo').addEventListener('click', ()=>{ $('#bConfirm').hidden=true; $('#bClear').hidden=false; });
$('#bYes').addEventListener('click', ()=>{ wrong.clear(); saveWrong(); renderBook(); });

/* ===== 其他 ===== */
$('#mixBtn').addEventListener('click', ()=>startQuiz('mix'));
$('#soundBtn').addEventListener('click', ()=>{ soundOn=!soundOn; store.set(K.sound, soundOn); $('#soundBtn').textContent='音效：'+(soundOn?'開':'關'); });
document.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click', renderHome));

renderHome();
})();
</script>
