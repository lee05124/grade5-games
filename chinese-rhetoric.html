<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>修辭小偵探</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Huninn&family=LXGW+WenKai+TC:wght@400;700&display=swap">
<style>
/* Layout: same graph-paper column as 湊湊樂. Sentences are set in 楷書 on a lined 稿紙 card; 譬喻 roles use three fixed colours (喻體 blue, 喻詞 gold, 喻依 green). */
:root{
  --paper:#F3F7FC; --grid:#DCE6F2; --surface:#FFFFFF; --line:#CBD8E8;
  --ink:#1D2942; --muted:#5A6A86;
  --tile:#FFD45E; --tile-edge:#D9A21E; --tile-ink:#3B2A00;
  --op:#2E66D1; --op-soft:#E3ECFB;
  --red:#D23B3B; --red-soft:#FBE4E4; --good:#1F8A55; --good-soft:#DDF2E6; --gold:#E9A817;
  --body:#2E66D1; --body-soft:#E3ECFB; --word:#B7791F; --word-soft:#FCEFD3; --vehicle:#1F8A55; --vehicle-soft:#DDF2E6;
  --rule:#F2C7C7;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;
  --f-kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti",serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C2B25; --grid:#263A32; --surface:#22352D; --line:#34493F;
    --ink:#EEF2E8; --muted:#A8B8AC;
    --tile:#F3CB52; --tile-edge:#AD8417; --tile-ink:#2A1F00;
    --op:#8DB6FF; --op-soft:#2A4250;
    --red:#FF7D7D; --red-soft:#4A2D2D; --good:#6FD6A0; --good-soft:#1E3B2E; --gold:#F1BF3D;
    --body:#8DB6FF; --body-soft:#2A4250; --word:#F1BF3D; --word-soft:#4A3D1E; --vehicle:#6FD6A0; --vehicle-soft:#1E3B2E;
    --rule:#5A3A3A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C2B25; --grid:#263A32; --surface:#22352D; --line:#34493F;
  --ink:#EEF2E8; --muted:#A8B8AC;
  --tile:#F3CB52; --tile-edge:#AD8417; --tile-ink:#2A1F00;
  --op:#8DB6FF; --op-soft:#2A4250;
  --red:#FF7D7D; --red-soft:#4A2D2D; --good:#6FD6A0; --good-soft:#1E3B2E; --gold:#F1BF3D;
  --body:#8DB6FF; --body-soft:#2A4250; --word:#F1BF3D; --word-soft:#4A3D1E; --vehicle:#6FD6A0; --vehicle-soft:#1E3B2E;
  --rule:#5A3A3A;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px; color:var(--ink); font-family:var(--f-display); font-size:16px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 40px;
}
.wrap{max-width:560px;margin:0 auto}
section.screen{display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--op);outline-offset:3px}
h1{margin:0;font-size:1.9rem;font-weight:400;letter-spacing:.04em;line-height:1.2}
h1 small{display:block;font-size:.85rem;color:var(--muted);letter-spacing:.02em;margin-top:4px}
h2{margin:0;font-size:1rem;font-weight:400;color:var(--muted);letter-spacing:.06em}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel p{margin:0}
.rules{display:grid;gap:10px}
.rule-card{border-left:4px solid var(--op);padding:2px 0 2px 12px}
.rule-card b{font-weight:400;font-size:1.05rem}
.rule-card p{font-size:.92rem;color:var(--muted);line-height:1.65}
.role{border-radius:6px;padding:0 5px;font-family:var(--f-kai);font-weight:700}
.role.body{background:var(--body-soft);color:var(--body)}
.role.word{background:var(--word-soft);color:var(--word)}
.role.vehicle{background:var(--vehicle-soft);color:var(--vehicle)}
.modes{display:grid;gap:10px}
.mode{appearance:none;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center}
.mode:hover{border-color:var(--op)}
.mode .badge{grid-row:span 2;width:2.6rem;height:2.6rem;border-radius:10px;background:var(--tile);box-shadow:0 3px 0 var(--tile-edge);color:var(--tile-ink);display:grid;place-items:center;font-family:var(--f-kai);font-weight:700;font-size:1.3rem}
.mode b{font-weight:400;font-size:1.12rem}
.mode small{grid-column:2;color:var(--muted);font-size:.88rem;line-height:1.5}
.mode .best{grid-row:span 2;grid-column:3;color:var(--gold);font-size:.85rem;white-space:nowrap}
details.panel{display:block}
details.panel summary{cursor:pointer;color:var(--muted);letter-spacing:.04em}
.bank h3{margin:14px 0 4px;font-size:1rem;font-weight:400;color:var(--op)}
.bank ol{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:4px;font-family:var(--f-kai);font-size:1.02rem}
.bank ol small{font-family:var(--f-display);color:var(--muted);font-size:.8rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip-btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:.88rem;color:var(--ink);text-decoration:none;display:inline-block}

.hud{display:flex;align-items:center;gap:6px}
.back{appearance:none;border:0;background:none;color:var(--op);padding:4px 0;font-size:.95rem;white-space:nowrap;flex:none}
.hud .ttl{font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{flex:none;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;white-space:nowrap}
.stat b{font-family:var(--f-num);font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.progress{height:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--good);transition:width .35s ease}
.ask{margin:0;font-size:1.1rem;line-height:1.55}
.ask small{display:block;font-size:.86rem;color:var(--muted)}
.sheet{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px 18px 20px;
  background-image:repeating-linear-gradient(transparent 0 2.55rem, var(--rule) 2.55rem calc(2.55rem + 1px));background-position:0 1.2rem;
  font-family:var(--f-kai);font-size:1.45rem;line-height:2.56rem;letter-spacing:.04em}
.seg{appearance:none;border:0;background:none;padding:0 2px;margin:0 1px;border-radius:6px;font:inherit;letter-spacing:inherit;line-height:inherit;color:inherit;
  box-shadow:inset 0 -3px 0 var(--line);cursor:pointer}
.seg:hover{box-shadow:inset 0 -3px 0 var(--op);background:var(--op-soft)}
.seg.done{box-shadow:none;cursor:default}
.seg.body.done{background:var(--body-soft);color:var(--body)}
.seg.word.done{background:var(--word-soft);color:var(--word)}
.seg.vehicle.done{background:var(--vehicle-soft);color:var(--vehicle)}
.seg.shake{animation:shake .36s;background:var(--red-soft)}
.seg.flash{animation:flash .8s ease-in-out 2}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes flash{50%{background:var(--tile)}}
.seg-tag{display:inline-block;font-family:var(--f-display);font-size:.7rem;line-height:1;vertical-align:super;margin-left:2px;letter-spacing:0}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{border-radius:999px;padding:2px 12px;font-size:.9rem;border:1.5px solid var(--line);color:var(--muted)}
.step.now{border-color:var(--op);color:var(--op)}
.step.ok{border-color:transparent}
.step.ok.body{background:var(--body-soft);color:var(--body)}
.step.ok.word{background:var(--word-soft);color:var(--word)}
.step.ok.vehicle{background:var(--vehicle-soft);color:var(--vehicle)}
.choices{display:grid;gap:8px}
.choices.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:400px){ .choices.c5{grid-template-columns:repeat(3,minmax(0,1fr))} }
.choice{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-size:1.02rem;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.25}
.choice small{font-size:.72rem;color:var(--muted)}
.choice:not(:disabled):hover{border-color:var(--op)}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.bad{border-color:var(--red);background:var(--red-soft)}
.choice:disabled{cursor:default}
.feedback{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.feedback p{margin:0;line-height:1.7}
.verdict{font-size:1.08rem}
.verdict.ok{color:var(--good)} .verdict.bad{color:var(--red)}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:1.05rem;background:var(--op);color:var(--surface);width:100%}
.btn:hover{filter:brightness(1.06)}
.btn.warm{background:var(--tile);color:var(--tile-ink);box-shadow:0 3px 0 var(--tile-edge)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.rhead{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.rhead .big{font-family:var(--f-num);font-weight:800;font-size:3.6rem;line-height:1;color:var(--red);margin:0}
.rhead .big small{font-family:var(--f-display);font-weight:400;font-size:1.1rem;color:var(--muted);margin-left:4px}
.rhead p{margin:0}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="wrap">

  <section class="screen" id="home">
    <header><h1>修辭小偵探<small>五年級國語：譬喻、摹寫</small></h1></header>
    <section class="panel">
      <h2>先複習</h2>
      <div class="rules">
        <div class="rule-card"><b>譬喻</b><p>用另一樣有相似點的東西來比方。由三個部分組成：<span class="role body">喻體</span>被比喻的東西、<span class="role word">喻詞</span>像、好像、如同、好比、彷彿、是、成了、<span class="role vehicle">喻依</span>拿來比喻的東西。</p></div>
        <div class="rule-card" style="border-color:var(--gold)"><b>摹寫</b><p>把感官的感受具體寫出來：看到的（視覺）、聽到的（聽覺）、聞到的（嗅覺）、嚐到的（味覺）、摸到的（觸覺）。</p></div>
      </div>
    </section>
    <div class="modes">
      <button class="mode" type="button" data-mode="kind"><span class="badge">辨</span><b>譬喻還是摹寫？</b><small>判斷句子用了哪一種修辭，或是都沒有。</small><span class="best" id="best-kind"></span></button>
      <button class="mode" type="button" data-mode="sense"><span class="badge">感</span><b>哪一種摹寫？</b><small>視覺、聽覺、嗅覺、味覺、觸覺，選出來。</small><span class="best" id="best-sense"></span></button>
      <button class="mode" type="button" data-mode="parts"><span class="badge">拆</span><b>譬喻拆解</b><small>在句子裡依序點出喻體、喻詞、喻依。</small><span class="best" id="best-parts"></span></button>
    </div>
    <details class="panel bank"><summary>全部例句（給家長核對）</summary><div id="bankBody"></div></details>
    <div class="foot">
      <a class="chip-btn" href="index.html">← 五年級湊湊樂</a>
      <button class="chip-btn" id="soundBtn" type="button">音效：開</button>
    </div>
  </section>

  <section class="screen" id="play" hidden>
    <div class="hud">
      <button class="back" type="button" data-home>← 回首頁</button>
      <span class="ttl" id="title"></span>
      <span class="stat">第 <b id="no">1</b> / 10 題</span>
      <span class="stat">答對 <b id="right">0</b></span>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <p class="ask" id="ask"></p>
    <div class="steps" id="steps" hidden></div>
    <div class="sheet" id="sheet"></div>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="fb" hidden><p class="verdict" id="verdict"></p><p id="exp"></p></div>
    <button class="btn warm" id="next" type="button" hidden>下一題</button>
  </section>

  <section class="screen" id="res" hidden>
    <div class="rhead"><h2 id="rTitle"></h2><p class="big" id="rBig"></p><p id="rLine"></p></div>
    <button class="btn warm" id="rAgain" type="button">再玩一次</button>
    <button class="btn ghost" type="button" data-home>回首頁</button>
  </section>
</div>

<script>
(function(){
"use strict";
/*DATA-START*/
// 譬喻：[喻體]{喻詞}<喻依>；第二欄 1 表示這句只用了譬喻，可以出在「譬喻還是摹寫」
const METAPHORS = [
 ['[時間]{像}<流水>，一去不回頭。',1],
 ['[書本]{是}<知識的寶庫>。',1],
 ['[老師]{就像}<一盞明燈>，照亮我們前進的路。',1],
 ['[友誼]{是}<一座橋梁>，連接你我的心。',1],
 ['[希望]{彷彿}<黑夜裡的星星>。',1],
 ['[讀書]{好比}<蓋房子>，地基一定要打穩。',1],
 ['[挫折]{是}<成長的養分>。',1],
 ['[逆境]{就像}<強風>，能把翅膀練得更有力。',1],
 ['[他的心情]{像}<坐雲霄飛車>，一下子高，一下子低。',1],
 ['[圖書館]{是}<我的祕密基地>。',1],
 ['[媽媽的叮嚀]{如同}<一張溫暖的毛毯>。',1],
 ['[弟弟的臉]紅得{像}<熟透的蘋果>。',0],
 ['[天上的白雲]{好像}<一團團棉花糖>。',0],
 ['夜晚，[這座城市]{成了}<一片燈海>。',0],
 ['[爺爺的手]粗糙得{像}<老樹皮>。',0]
];
// 摹寫：[感官, 句子, 關鍵詞]；只用摹寫、沒有比喻
const SENSES = [
 ['視覺','花園裡開滿了紅的、黃的、紫的花。','紅的、黃的、紫的'],
 ['視覺','夜空中的星星一閃一閃的。','一閃一閃'],
 ['視覺','弟弟的臉頰紅通通的。','紅通通'],
 ['視覺','湖水清澈見底，連水底的小石頭都看得清清楚楚。','清澈見底'],
 ['聽覺','窗外傳來嘩啦嘩啦的雨聲。','嘩啦嘩啦'],
 ['聽覺','一進教室，就聽到同學們嘰嘰喳喳的說話聲。','嘰嘰喳喳'],
 ['聽覺','遠方傳來轟隆隆的雷聲。','轟隆隆'],
 ['聽覺','樹上的蟬「知了、知了」叫個不停。','知了、知了'],
 ['嗅覺','剛出爐的麵包，散發出濃濃的奶油香。','濃濃的奶油香'],
 ['嗅覺','下過雨的草地，飄來一股泥土的氣味。','泥土的氣味'],
 ['嗅覺','一走進廚房，就聞到滷肉的香味。','滷肉的香味'],
 ['嗅覺','路邊的垃圾桶傳出一陣刺鼻的臭味。','刺鼻的臭味'],
 ['味覺','這杯檸檬汁酸溜溜的。','酸溜溜'],
 ['味覺','外婆煮的綠豆湯甜而不膩。','甜而不膩'],
 ['味覺','苦瓜吃起來苦苦的，我一點也不喜歡。','苦苦的'],
 ['味覺','這碗麻辣鍋辣得我舌頭發麻。','辣得我舌頭發麻'],
 ['觸覺','冬天的井水摸起來冰冰涼涼的。','冰冰涼涼'],
 ['觸覺','小貓的毛軟綿綿的，摸起來好舒服。','軟綿綿'],
 ['觸覺','夏天的柏油路熱得燙腳。','熱得燙腳'],
 ['觸覺','爸爸還沒刮鬍子，臉頰摸起來刺刺的。','刺刺的']
];
// 沒有用修辭、只是說明事情的句子
const PLAIN = [
 '我們明天要去動物園。',
 '這本書一共有兩百頁。',
 '哥哥每天騎腳踏車上學。',
 '下課後，我先寫完功課才看電視。',
 '學校的運動會在星期六舉行。',
 '妹妹今年八歲，讀二年級。'
];
/*DATA-END*/
const SENSE_LIST = ['視覺','聽覺','嗅覺','味覺','觸覺'];
const SENSE_HINT = {'視覺':'眼睛看','聽覺':'耳朵聽','嗅覺':'鼻子聞','味覺':'嘴巴嚐','觸覺':'皮膚摸'};
function parseM(s){
  const segs = []; const re = /\[([^\]]+)\]|\{([^}]+)\}|<([^>]+)>|([^\[{<]+)/g; let m;
  while((m = re.exec(s[0]))){
    if(m[1]) segs.push({t:m[1], role:'body'});
    else if(m[2]) segs.push({t:m[2], role:'word'});
    else if(m[3]) segs.push({t:m[3], role:'vehicle'});
    else {
      // 其他文字依標點切成可以點的片段（當成干擾）
      m[4].split(/([，。、！？；「」])/).forEach(x => { if(!x) return; if(/^[，。、！？；「」]$/.test(x)) segs.push({t:x, punct:true}); else segs.push({t:x, role:'none'}); });
    }
  }
  const get = r => segs.find(x => x.role === r).t;
  return {segs, body:get('body'), word:get('word'), vehicle:get('vehicle'), plain:s[0].replace(/[\[\]{}<>]/g, ''), only:!!s[1]};
}
const MS = METAPHORS.map(parseM);
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const rint = n => Math.floor(Math.random() * n);
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rint(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
let soundOn = store.get('rh-sound', true) !== false, AC = null;
function beep(ok){
  if(!soundOn) return;
  try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime, notes = ok ? [660, 880] : [240, 190];
    notes.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(), st = t0 + i * 0.1; o.type = ok ? 'triangle' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, st); g.gain.exponentialRampToValueAtTime(ok ? 0.14 : 0.04, st + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.13);
      o.connect(g); g.connect(AC.destination); o.start(st); o.stop(st + 0.15); }); }catch(e){}
}
const best = store.get('rh-best', {}) || {};
// 題庫輪替：同一台裝置上，題庫裡每一題都出過一次以後才會重複（記在瀏覽器）
function Deck(key, ids){
  const all = ids.map(String), valid = new Set(all);
  const st = store.get(key, null) || {};
  let seen = new Set((st.s || []).filter(x => valid.has(x))), next = new Set((st.n || []).filter(x => valid.has(x)));
  if(seen.size >= all.length){ seen = next; next = new Set(); }
  const save = () => store.set(key, {s:Array.from(seen), n:Array.from(next)});
  return {
    // 先從還沒出過的題目抽；不夠時才從已出過的補，並避開新一輪已出過的
    draw(n, ok){
      const out = [];
      const take = list => { for(const x of shuffle(list)){ if(out.length >= n) return; if(out.includes(x) || (ok && !ok(x, out))) continue; out.push(x); } };
      take(all.filter(x => !seen.has(x)));
      if(out.length < n) take(all.filter(x => !next.has(x)));
      if(out.length < n) take(all);
      return out;
    },
    mark(id){
      id = String(id); if(!valid.has(id)) return;
      if(!seen.has(id)) seen.add(id); else next.add(id);
      if(seen.size >= all.length){ seen = next; next = new Set(); }
      save();
    },
    left(){ return all.filter(x => !seen.has(x)).length; }
  };
}
// 沒有固定題庫、由程式產生的題目：記住出過的，不再出（記滿 cap 筆就丟掉最舊的）
function SeenSet(key, cap){
  let arr = store.get(key, []) || [], set = new Set(arr);
  return {
    has(k){ return set.has(k); },
    add(k){ if(set.has(k)) return; arr.push(k); if(arr.length > cap) arr = arr.slice(-cap); set = new Set(arr); store.set(key, arr); },
    reset(){ arr = []; set = new Set(); store.set(key, arr); }
  };
}
const idx = (arr, f) => arr.map((x, i) => i).filter(i => !f || f(arr[i]));
const D = {
  kindM:Deck('rh-d-kind-m', idx(MS, x => x.only)),
  kindS:Deck('rh-d-kind-s', idx(SENSES)),
  kindP:Deck('rh-d-kind-p', idx(PLAIN)),
  sense:Object.fromEntries(SENSE_LIST.map(k => [k, Deck('rh-d-sense-' + k, idx(SENSES, x => x[0] === k))])),
  parts:Deck('rh-d-parts', idx(MS))
};
const MODE = {kind:'譬喻還是摹寫？', sense:'哪一種摹寫？', parts:'譬喻拆解'};
const ROLE = {body:'喻體', word:'喻詞', vehicle:'喻依'};
const ROLE_HINT = {body:'被比喻的東西', word:'連接的詞，像「像、是、好像」', vehicle:'拿來比喻的東西'};
function show(id){ ['home','play','res'].forEach(s => { $('#' + s).hidden = s !== id; }); window.scrollTo(0, 0); }
function goHome(){
  Object.keys(MODE).forEach(k => { $('#best-' + k).textContent = best[k] != null ? '最佳 ' + best[k] + '/10' : ''; });
  $('#soundBtn').textContent = '音效：' + (soundOn ? '開' : '關'); show('home');
}
document.querySelectorAll('[data-home]').forEach(b => b.addEventListener('click', goHome));
$('#soundBtn').addEventListener('click', () => { soundOn = !soundOn; store.set('rh-sound', soundOn); $('#soundBtn').textContent = '音效：' + (soundOn ? '開' : '關'); });
function renderBank(){
  const hlM = m => m.segs.map(x => x.role === 'body' || x.role === 'word' || x.role === 'vehicle' ? '<span class="role ' + x.role + '">' + x.t + '</span>' : x.t).join('');
  let h = '<h3>譬喻（' + MS.length + ' 句）</h3><ol>' + MS.map(m => '<li>' + hlM(m) + (m.only ? '' : ' <small>（也有摹寫，只出在「譬喻拆解」）</small>') + '</li>').join('') + '</ol>';
  h += '<h3>摹寫（' + SENSES.length + ' 句）</h3><ol>' + SENSES.map(s => '<li>' + s[1] + ' <small>' + s[0] + '：' + s[2] + '</small></li>').join('') + '</ol>';
  h += '<h3>沒有用修辭（' + PLAIN.length + ' 句）</h3><ol>' + PLAIN.map(s => '<li>' + s + '</li>').join('') + '</ol>';
  $('#bankBody').innerHTML = h;
}

/* ===== 出題 ===== */
let G = null;
function start(mode){
  let qs;
  if(mode === 'kind'){
    const m = D.kindM.draw(4).map(i => ({type:'譬喻', m:MS[+i], d:D.kindM, id:i}));
    const s = D.kindS.draw(4).map(i => ({type:'摹寫', s:SENSES[+i], d:D.kindS, id:i}));
    const p = D.kindP.draw(2).map(i => ({type:'都不是', p:PLAIN[+i], d:D.kindP, id:i}));
    qs = shuffle(m.concat(s, p));
  }else if(mode === 'sense'){
    // 每種感官各 2 題
    qs = shuffle(SENSE_LIST.flatMap(k => D.sense[k].draw(2).map(i => ({s:SENSES[+i], d:D.sense[k], id:i}))));
  }else{
    qs = D.parts.draw(10).map(i => ({m:MS[+i], d:D.parts, id:i}));
  }
  G = {mode, qs, i:0, right:0};
  $('#title').textContent = MODE[mode];
  show('play'); render();
}
function render(){
  const q = G.qs[G.i]; G.answered = false; q.d.mark(q.id);
  $('#no').textContent = G.i + 1; $('#right').textContent = G.right;
  $('#bar').style.width = (G.i / G.qs.length * 100) + '%';
  $('#fb').hidden = true; $('#next').hidden = true;
  const sheet = $('#sheet'), ch = $('#choices');
  sheet.innerHTML = ''; ch.innerHTML = ''; ch.hidden = false; $('#steps').hidden = true;
  if(G.mode === 'kind'){
    $('#ask').innerHTML = '這個句子用了哪一種修辭？';
    sheet.textContent = q.m ? q.m.plain : q.s ? q.s[1] : q.p;
    ch.className = 'choices c3';
    [['譬喻','拿東西比方'],['摹寫','寫出感官感受'],['都不是','只是說明']].forEach(([v, hint]) => addChoice(v, hint, () => answerChoice(v, q.type)));
  }else if(G.mode === 'sense'){
    $('#ask').innerHTML = '這是哪一種摹寫？';
    sheet.textContent = q.s[1];
    ch.className = 'choices c5';
    SENSE_LIST.forEach(v => addChoice(v, SENSE_HINT[v], () => answerChoice(v, q.s[0])));
  }else{
    ch.hidden = true; $('#steps').hidden = false;
    G.step = 0; G.miss = 0;
    q.m.segs.forEach((x, k) => {
      if(x.punct){ sheet.appendChild(document.createTextNode(x.t)); return; }
      const b = document.createElement('button'); b.type = 'button'; b.className = 'seg'; b.textContent = x.t; b.dataset.role = x.role; b.dataset.k = k;
      b.addEventListener('click', () => tapSeg(b));
      sheet.appendChild(b);
    });
    drawSteps();
  }
}
function addChoice(v, hint, fn){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.dataset.v = v;
  b.innerHTML = '<span></span><small></small>'; b.firstChild.textContent = v; b.lastChild.textContent = hint;
  b.addEventListener('click', fn); $('#choices').appendChild(b);
}
function explainKind(q){
  if(q.m) return '把「' + q.m.body + '」比喻成「' + q.m.vehicle + '」，喻詞是「' + q.m.word + '」，所以是譬喻。';
  if(q.s) return '「' + q.s[2] + '」寫出' + SENSE_HINT[q.s[0]] + '到的感受，是' + q.s[0] + '摹寫。';
  return '這句只是說明一件事，沒有拿東西比方，也沒有特別描寫感官感受。';
}
function answerChoice(v, ans){
  if(G.answered) return; G.answered = true;
  const q = G.qs[G.i], ok = v === ans;
  if(ok) G.right++;
  $('#right').textContent = G.right; beep(ok);
  Array.from($('#choices').children).forEach(x => { x.disabled = true; if(x.dataset.v === ans) x.classList.add('ok'); else if(x.dataset.v === v) x.classList.add('bad'); });
  $('#verdict').className = 'verdict ' + (ok ? 'ok' : 'bad');
  $('#verdict').textContent = ok ? '答對了！' : '答案是「' + ans + '」';
  $('#exp').textContent = G.mode === 'kind' ? explainKind(q) : '「' + q.s[2] + '」是' + SENSE_HINT[q.s[0]] + '到的感受，所以是' + q.s[0] + '摹寫。';
  finishQ();
}
const ORDER = ['body','word','vehicle'];
function drawSteps(){
  $('#steps').innerHTML = ORDER.map((r, k) => '<span class="step ' + r + (k < G.step ? ' ok' : k === G.step ? ' now' : '') + '">' + (k + 1) + '. ' + ROLE[r] + '</span>').join('');
  if(G.step < 3) $('#ask').innerHTML = '點出<b>' + ROLE[ORDER[G.step]] + '</b><small>' + ROLE_HINT[ORDER[G.step]] + '</small>';
}
function tapSeg(b){
  if(G.answered || b.classList.contains('done')) return;
  const want = ORDER[G.step];
  if(b.dataset.role === want){
    b.classList.add('done', want);
    const tag = document.createElement('span'); tag.className = 'seg-tag'; tag.textContent = ROLE[want]; b.appendChild(tag);
    G.step++; drawSteps();
    if(G.step === 3){
      G.answered = true;
      const q = G.qs[G.i], ok = G.miss === 0;
      if(ok) G.right++;
      $('#right').textContent = G.right; beep(true);
      $('#ask').innerHTML = '三個部分都找到了！';
      $('#verdict').className = 'verdict ' + (ok ? 'ok' : 'bad');
      $('#verdict').textContent = ok ? '一次都沒點錯！' : '完成了（點錯 ' + G.miss + ' 次，這題不算分）';
      $('#exp').innerHTML = '<span class="role body">' + q.m.body + '</span> 被比喻成 <span class="role vehicle">' + q.m.vehicle + '</span>，中間用喻詞 <span class="role word">' + q.m.word + '</span> 連起來。';
      document.querySelectorAll('#sheet .seg').forEach(x => x.classList.add('done'));
      finishQ();
    }
  }else{
    G.miss++; beep(false);
    b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    setTimeout(() => b.classList.remove('shake'), 400);
    if(G.miss >= 2){ const t = document.querySelector('#sheet .seg[data-role="' + want + '"]'); if(t){ t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); } }
  }
}
function finishQ(){
  $('#fb').hidden = false; $('#next').hidden = false;
  $('#next').textContent = G.i === G.qs.length - 1 ? '看成績' : '下一題';
  $('#bar').style.width = ((G.i + 1) / G.qs.length * 100) + '%';
  $('#next').focus({preventScroll:true});
}
$('#next').addEventListener('click', () => {
  if(G.i < G.qs.length - 1){ G.i++; render(); window.scrollTo(0, 0); }
  else{
    if(best[G.mode] == null || G.right > best[G.mode]){ best[G.mode] = G.right; store.set('rh-best', best); }
    $('#rTitle').textContent = MODE[G.mode] + '・成績';
    $('#rBig').innerHTML = G.right + '<small>/ 10 題</small>';
    $('#rLine').textContent = G.right === 10 ? '全部答對。' : G.mode === 'parts' ? '先找喻詞（像、是、好像），前面通常是喻體，後面是喻依。' : G.mode === 'sense' ? '想一想：這是用眼睛、耳朵、鼻子、嘴巴，還是皮膚感受到的？' : '有「像、是、好像」把兩樣東西連起來的是譬喻；寫出看、聽、聞、嚐、摸的感受是摹寫。';
    show('res');
  }
});
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => start(b.dataset.mode)));
$('#rAgain').addEventListener('click', () => start(G.mode));
renderBank(); goHome();
})();
</script>
</body>
</html>
