<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>長母音消消樂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Huninn&display=swap">
<style>
/* Layout: same graph-paper column as 湊湊樂. Home = three mode cards. Play = HUD, star meter, 本局 chips, 6×6 word-tile board, word card with the vowel team in red, tools. Andika = literacy typeface with single-storey a/g. */
:root{
  --paper:#F3F7FC; --grid:#DCE6F2; --surface:#FFFFFF; --line:#CBD8E8;
  --ink:#1D2942; --muted:#5A6A86;
  --tile:#FFD45E; --tile-edge:#D9A21E; --tile-ink:#3B2A00;
  --op:#2E66D1; --op-soft:#E3ECFB;
  --red:#D23B3B; --red-soft:#FBE4E4; --good:#1F8A55; --good-soft:#DDF2E6; --gold:#E9A817;
  --c1:#FFD45E; --c1e:#D9A21E; --c2:#9FD4F5; --c2e:#5A9FC9; --c3:#F8AFBD; --c3e:#CB6E82;
  --c4:#B2E0A6; --c4e:#6BA95F; --c5:#D0BEF4; --c5e:#9079CC; --cink:#24222B;
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2","Arial Rounded MT Bold","Helvetica Neue",Arial,sans-serif;
  --f-en:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --r:14px; --t-move:280ms;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C2B25; --grid:#263A32; --surface:#22352D; --line:#34493F;
    --ink:#EEF2E8; --muted:#A8B8AC;
    --tile:#F3CB52; --tile-edge:#AD8417; --tile-ink:#2A1F00;
    --op:#8DB6FF; --op-soft:#2A4250;
    --red:#FF7D7D; --red-soft:#4A2D2D; --good:#6FD6A0; --good-soft:#1E3B2E; --gold:#F1BF3D;
    --c1:#F3CB52; --c1e:#AD8417; --c2:#82BEE3; --c2e:#407FA6; --c3:#E796A6; --c3e:#A55569;
    --c4:#97CD8B; --c4e:#518B47; --c5:#B6A2E4; --c5e:#7059AC; --cink:#1C1B22;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C2B25; --grid:#263A32; --surface:#22352D; --line:#34493F;
  --ink:#EEF2E8; --muted:#A8B8AC;
  --tile:#F3CB52; --tile-edge:#AD8417; --tile-ink:#2A1F00;
  --op:#8DB6FF; --op-soft:#2A4250;
  --red:#FF7D7D; --red-soft:#4A2D2D; --good:#6FD6A0; --good-soft:#1E3B2E; --gold:#F1BF3D;
  --c1:#F3CB52; --c1e:#AD8417; --c2:#82BEE3; --c2e:#407FA6; --c3:#E796A6; --c3e:#A55569;
  --c4:#97CD8B; --c4e:#518B47; --c5:#B6A2E4; --c5e:#7059AC; --cink:#1C1B22;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px; color:var(--ink); font-family:var(--f-display); font-size:16px; line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:20px 40px;
}
.wrap{max-width:560px;margin:0 auto}
section.screen{display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--op);outline-offset:3px}
h1{margin:0;font-size:1.9rem;font-weight:400;letter-spacing:.04em;line-height:1.2;text-wrap:balance}
h1 small{display:block;font-size:.85rem;color:var(--muted);letter-spacing:.02em;margin-top:4px}
h2{margin:0;font-size:1rem;font-weight:400;color:var(--muted);letter-spacing:.06em}
.en{font-family:var(--f-en);font-weight:700;letter-spacing:.01em}
.en b,.hl b{color:var(--red);font-weight:700}

.modegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.modegrid{grid-template-columns:1fr}}
.mode{appearance:none;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s}
.mode:hover{border-color:var(--op)}
.mode .top{display:flex;align-items:center;gap:10px}
.mode .nm{font-size:1.15rem;line-height:1.3}
.mode .stars{margin-left:auto}
.mode .d{font-size:.9rem;color:var(--muted);line-height:1.5;margin:0}
.ex{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.92rem}
.mini{min-width:2.6rem;height:2rem;padding:0 6px;border-radius:7px;background:var(--tile);box-shadow:0 2px 0 var(--tile-edge);color:var(--tile-ink);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;font-family:var(--f-en);font-weight:700;font-size:.95rem;line-height:1}
.mini b{color:var(--red)}
.mini[data-c="2"]{background:var(--c2);box-shadow:0 2px 0 var(--c2e);color:var(--cink)}
.badge{width:2.4rem;height:2.4rem;flex:none;border-radius:10px;background:var(--op-soft);color:var(--op);display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:1.05rem;line-height:1}
.stars{font-size:1.05rem;letter-spacing:1px;white-space:nowrap;line-height:1}
.stars i{font-style:normal;color:var(--line)}
.stars i.on{color:var(--gold)}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 16px}
.panel ol{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
details.panel summary{cursor:pointer;color:var(--muted);letter-spacing:.04em}
.bank h3{margin:14px 0 4px;font-size:1rem;font-weight:400;color:var(--op)}
.bank p{margin:0 0 6px;font-size:.92rem;line-height:1.7}
.bank .note{color:var(--muted);font-size:.85rem}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem}
.chip-btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 14px;font-size:.88rem;color:var(--ink);text-decoration:none;display:inline-block}
.chip-btn:hover{border-color:var(--op)}
.foot .btns{display:flex;gap:8px;flex-wrap:wrap}

.hud{display:flex;align-items:center;gap:6px}
.back{appearance:none;border:0;background:none;color:var(--op);padding:4px 0;font-size:.95rem;white-space:nowrap;flex:none}
.hud .ttl{font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{flex:none;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.stat b{font-family:var(--f-num);font-size:1.2rem;font-variant-numeric:tabular-nums;font-weight:800;min-width:1.4em;text-align:right}
.stat.low b{color:var(--red)}
.meter{position:relative;height:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;margin:6px 6px 10px}
.meter .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:var(--good);transition:width .4s ease}
.meter .mk{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:1.15rem;line-height:1;color:var(--line)}
.meter .mk.on{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .lbl{font-size:.82rem;color:var(--muted);margin-right:2px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:1px 10px;font-size:.9rem;line-height:1.6;display:inline-flex;align-items:center;gap:5px}
.chip .en{color:var(--op)}
.chip small{color:var(--muted);font-size:.78rem}
.chip .sw{min-width:1.3rem;height:1.3rem;padding:0 4px;border-radius:5px;display:grid;place-items:center;font-family:var(--f-en);font-weight:700;font-size:.8rem;color:var(--cink)}
.boardwrap{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:6px}
#board{position:relative;width:100%;aspect-ratio:1;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;container-type:inline-size;border-radius:14px;outline:none}
#board:focus-visible{box-shadow:0 0 0 3px var(--op)}
.tile{position:absolute;left:0;top:0;width:calc(100% / 6);height:calc(100% / 6);transition:transform var(--t-move) cubic-bezier(.3,.75,.4,1);will-change:transform}
.face{--bg:var(--tile);--edge:var(--tile-edge);position:absolute;inset:3px;border-radius:11px;background:var(--bg);box-shadow:0 3px 0 var(--edge);color:var(--tile-ink);
  display:grid;place-items:center;font-family:var(--f-en);font-weight:700;line-height:1;font-size:18px;font-size:5.6cqw;transition:transform .18s ease, opacity .2s ease, box-shadow .15s ease}
.face[data-len="4"]{font-size:16px;font-size:5cqw}
.face[data-len="5"]{font-size:14px;font-size:4.4cqw}
.face[data-len="6"]{font-size:13px;font-size:3.9cqw}
.face[data-c]{color:var(--cink)}
.face[data-c="1"]{--bg:var(--c1);--edge:var(--c1e)}
.face[data-c="2"]{--bg:var(--c2);--edge:var(--c2e)}
.face[data-c="3"]{--bg:var(--c3);--edge:var(--c3e)}
.face[data-c="4"]{--bg:var(--c4);--edge:var(--c4e)}
.face[data-c="5"]{--bg:var(--c5);--edge:var(--c5e)}
.tile.sel .face{transform:translateY(-3px);box-shadow:0 5px 0 var(--edge),0 0 0 3px var(--op)}
.tile.hint .face{animation:hint .9s ease-in-out 3}
@keyframes hint{50%{transform:scale(1.1);box-shadow:0 3px 0 var(--edge),0 0 0 4px var(--good)}}
.tile.gone .face{transform:scale(.25) rotate(-8deg);opacity:0}
#board.kbd .tile.cur::after{content:"";position:absolute;inset:0;border:2.5px dashed var(--op);border-radius:12px;pointer-events:none}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-num);font-weight:800;font-size:1.4rem;color:var(--red);pointer-events:none;animation:rise .8s ease-out forwards;text-shadow:0 1px 0 var(--surface),0 0 6px var(--surface);white-space:nowrap;z-index:5}
@keyframes rise{from{opacity:0;margin-top:6px}20%{opacity:1}to{opacity:0;margin-top:-34px}}

.card{position:relative;display:flex;gap:14px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:96px}
.word{flex:none;min-width:5.2rem;height:4.2rem;padding:0 10px;display:flex;align-items:center;justify-content:center;white-space:nowrap;border:2px solid var(--red);border-radius:12px;font-family:var(--f-en);font-weight:700;font-size:1.9rem;line-height:1;color:var(--ink);background:var(--surface)}
.word b{color:var(--red)}
.cinfo{min-width:0;flex:1}
.cinfo p{margin:0}
.ctitle{font-size:1.08rem;line-height:1.4}
.cbody{font-size:.98rem;line-height:1.6;color:var(--muted)}
.cbody .en{color:var(--ink)}
.say{appearance:none;flex:none;width:2.4rem;height:2.4rem;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--op)}
.say svg,.act svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.combo{position:absolute;top:-10px;right:10px;background:var(--red);color:var(--surface);border-radius:999px;padding:0 10px;font-size:.85rem;line-height:1.6}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.act[aria-pressed="true"]{border-color:var(--op);background:var(--op-soft);color:var(--op)}
.msg{min-height:1.6em;text-align:center;font-size:.95rem;color:var(--muted);margin:-6px 0 0}
.msg.warn{color:var(--red)}

.result-head{text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.result-head .big{font-family:var(--f-num);font-weight:800;font-size:4rem;line-height:1;color:var(--red);font-variant-numeric:tabular-nums;margin:0}
.result-head .big small{font-family:var(--f-display);font-weight:400;font-size:1.1rem;color:var(--muted);margin-left:4px}
.result-head .stars{font-size:2.4rem;letter-spacing:6px}
.result-head p{margin:0}
.rlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.rlist li{border-left:4px solid var(--tile-edge);padding:2px 0 2px 10px;line-height:1.7}
.rlist li.miss{border-left-color:var(--line);color:var(--muted)}
.btnrow{display:grid;gap:10px}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-size:1.05rem;background:var(--op);color:var(--surface)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition-duration:.01ms!important} }
</style>
</head>
<body>
<div class="wrap">

  <section class="screen" id="home">
    <header><h1>長母音消消樂<small>Long Vowels・交換相鄰的單字，讓三個連成一線</small></h1></header>
    <div class="modegrid" id="modegrid"></div>
    <section class="panel">
      <h2>怎麼玩</h2>
      <ol>
        <li>點一個單字，再點上下左右相鄰的單字，兩個會交換。也可以用手指滑。</li>
        <li>點單字時會唸出來（可以在下方關掉）。</li>
        <li>換完能消才算一步，不能消會換回來。每局 20 步。</li>
        <li>卡住了按「提示」。</li>
      </ol>
    </section>
    <details class="panel bank">
      <summary>單字表（給家長核對）</summary>
      <div id="bankBody"></div>
    </details>
    <div class="foot">
      <a class="chip-btn" href="index.html">← 五年級湊湊樂</a>
      <span class="btns">
        <button class="chip-btn" id="speakBtn" type="button">唸單字：開</button>
        <button class="chip-btn" id="soundBtn" type="button">音效：開</button>
      </span>
    </div>
  </section>

  <section class="screen" id="play" hidden>
    <div class="hud">
      <button class="back" type="button" id="backBtn">← 選模式</button>
      <span class="ttl" id="pTitle"></span>
      <span class="stat" id="movesStat">步數 <b id="pMoves">20</b></span>
      <span class="stat">分數 <b id="pScore">0</b></span>
    </div>
    <div class="meter" aria-hidden="true"><span class="fill" id="meterFill"></span><span class="mk" id="mk1">★</span><span class="mk" id="mk2">★</span><span class="mk" id="mk3">★</span></div>
    <div class="chips" id="chips"></div>
    <div class="boardwrap"><div id="board" tabindex="0" aria-label="單字盤面。可以用方向鍵移動，按 Enter 選字，再選相鄰的字交換。"></div></div>
    <div class="card" aria-live="polite">
      <div class="word" id="cWord"></div>
      <div class="cinfo"><p class="ctitle" id="cTitle"></p><p class="cbody" id="cBody"></p></div>
      <button class="say" id="cSay" type="button" aria-label="再唸一次"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
      <span class="combo" id="cCombo" hidden></span>
    </div>
    <p class="msg" id="msg"></p>
    <div class="tools">
      <button class="act" id="hintBtn" type="button"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>提示</button>
      <button class="act" id="zhBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 5h9"/><path d="M8.5 3v2"/><path d="M6 5c0 4 2.5 7 6 8"/><path d="M11 5c0 3-2 7-7 9"/><path d="M13 21l4-10 4 10"/><path d="M14.5 17.5h5"/></svg>中文意思</button>
      <button class="act" id="newBtn" type="button"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>換一局</button>
    </div>
  </section>

  <section class="screen" id="result" hidden>
    <div class="result-head">
      <h2 id="rTitle"></h2>
      <p class="big"><span id="rScore">0</span><small>分</small></p>
      <div class="stars" id="rStars"></div>
      <p id="rLine"></p>
    </div>
    <section class="panel"><h2 id="rListTitle">這局消掉的單字</h2><ul class="rlist" id="rList"></ul></section>
    <div class="btnrow">
      <button class="btn" id="againBtn" type="button">再玩一局</button>
      <button class="btn ghost" id="homeBtn" type="button">換模式</button>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";
/*DATA-START*/
// [長母音, 拼法, "單字 中文|單字 中文…"]；只收拼法規則、念長母音的單字，避開例外字（如 said、bread、cow）
const PATTERNS = [
 ['a','a_e','cake 蛋糕|lake 湖|name 名字|game 遊戲|face 臉|gate 大門|plane 飛機|snake 蛇|grape 葡萄|make 做'],
 ['a','ai','rain 雨|train 火車|mail 信件|tail 尾巴|paint 油漆；畫|snail 蝸牛|wait 等待|nail 指甲；釘子'],
 ['a','ay','day 天；日子|May 五月|play 玩|say 說|way 路；方法|gray 灰色|stay 停留|pay 付錢'],
 ['e','e_e','these 這些|Pete 彼特（人名）|Steve 史蒂夫（人名）|theme 主題|scene 場景|delete 刪除|Eve 前夕（Christmas Eve 平安夜）'],
 ['e','ee','bee 蜜蜂|tree 樹|see 看見|feet 腳（複數）|green 綠色|sheep 綿羊|three 三|sleep 睡覺|week 星期；週|jeep 吉普車'],
 ['e','ea','tea 茶|sea 海|eat 吃|read 讀|meat 肉|leaf 葉子|beach 海灘|dream 夢|clean 乾淨的'],
 ['i','i_e','kite 風箏|nine 九|bike 腳踏車|five 五|rice 米飯|time 時間|line 線|ride 騎|white 白色|hide 躲藏'],
 ['i','ie','tie 領帶|pie 派|lie 說謊；躺|fries 薯條'],
 ['i','y','fly 飛|sky 天空|my 我的|cry 哭|dry 乾的|why 為什麼|shy 害羞的|try 嘗試'],
 ['o','o_e','note 筆記|rose 玫瑰|home 家|nose 鼻子|bone 骨頭|hope 希望|rope 繩子|stone 石頭|joke 笑話|hole 洞'],
 ['o','oa','boat 船|goat 山羊|coat 外套|road 道路|soap 肥皂|toast 吐司|coach 教練|loaf 一條（麵包）'],
 ['o','ow','low 低的|row 一排；划船|snow 雪|slow 慢的|bowl 碗|grow 生長|show 表演；展示|blow 吹|yellow 黃色|window 窗戶'],
 ['u','u_e','cute 可愛的|cube 立方體|huge 巨大的|use 使用|tube 管子|flute 長笛|June 六月|rule 規則|mule 騾子'],
 ['u','ue','blue 藍色|glue 膠水|clue 線索|true 真的|Sue 蘇（人名）'],
 ['u','ui','juice 果汁|suit 西裝|fruit 水果|cruise 郵輪旅行']
];
/*ENGINE-START*/
const ROWS = 6, COLS = 6, MOVES = 20, NTYPES = 5;
const VOWELS = ['a','e','i','o','u'];
function rint(n){ return Math.floor(Math.random() * n); }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = rint(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function parseWords(p){ return p[2].split('|').map(s => { const i = s.indexOf(' '); return {w:s.slice(0, i), zh:s.slice(i + 1), v:p[0], p:p[1]}; }); }
const ALL = PATTERNS.flatMap(parseWords);

function makeState(mode, pick){
  const S = {mode, types:[], g:null, uid:0};
  if(mode === 'sound'){
    S.types = VOWELS.map(v => ({k:v, items:ALL.filter(x => x.v === v)}));
  }else if(mode === 'pattern'){
    S.types = (Array.isArray(pick) ? pick.map(i => PATTERNS[i]) : shuffle(PATTERNS).slice(0, NTYPES)).map(p => ({k:p[1], v:p[0], items:parseWords(p)}));
  }else{
    const v = pick ? pick.v : VOWELS[rint(VOWELS.length)];
    const chosen = pick ? pick.words.map(w => ALL.find(x => x.w === w)) : shuffle(ALL.filter(x => x.v === v)).slice(0, NTYPES);
    S.types = chosen.map((it, i) => ({k:it.w, ci:i + 1, items:[it]}));
  }
  return S;
}
function newTile(S, type){
  if(!type.q || !type.q.length) type.q = shuffle(type.items);
  const it = type.q.pop();
  return {id:++S.uid, k:type.k, w:it.w, zh:it.zh, v:it.v, p:it.p, ci:type.ci || 0};
}
function randType(S){ return S.types[rint(S.types.length)]; }
function makesMatch(S, g, r, c, tile){
  return (c >= 2 && g[r][c-1].k === tile.k && g[r][c-2].k === tile.k) || (r >= 2 && g[r-1][c].k === tile.k && g[r-2][c].k === tile.k);
}
function fillBoard(S){
  for(let tries = 0; tries < 300; tries++){
    const g = [];
    for(let r = 0; r < ROWS; r++){ g.push([]); for(let c = 0; c < COLS; c++){ let t, n = 0; do { t = newTile(S, randType(S)); } while(makesMatch(S, g, r, c, t) && ++n < 60); g[r].push(t); } }
    S.g = g;
    if(!findMatches(S).hits.length && findMoves(S, 1).length) return true;
  }
  return false;
}
function findMatches(S){
  const g = S.g, hits = [], cells = new Set();
  for(let r = 0; r < ROWS; r++){ let c = 0; while(c < COLS){ let e = c + 1; while(e < COLS && g[r][e].k === g[r][c].k) e++; if(e - c >= 3){ const cs = []; for(let x = c; x < e; x++) cs.push([r,x]); hits.push({k:g[r][c].k, cells:cs}); } c = e; } }
  for(let c = 0; c < COLS; c++){ let r = 0; while(r < ROWS){ let e = r + 1; while(e < ROWS && g[e][c].k === g[r][c].k) e++; if(e - r >= 3){ const cs = []; for(let y = r; y < e; y++) cs.push([y,c]); hits.push({k:g[r][c].k, cells:cs}); } r = e; } }
  hits.forEach(h => h.cells.forEach(([r,c]) => cells.add(r * COLS + c)));
  return {hits, cells};
}
function swapG(g, r1, c1, r2, c2){ const t = g[r1][c1]; g[r1][c1] = g[r2][c2]; g[r2][c2] = t; }
function localMatch(S, r, c){
  const g = S.g, t = g[r][c];
  let a = c, b = c; while(a > 0 && g[r][a-1].k === t.k) a--; while(b + 1 < COLS && g[r][b+1].k === t.k) b++;
  if(b - a >= 2) return true;
  a = r; b = r; while(a > 0 && g[a-1][c].k === t.k) a--; while(b + 1 < ROWS && g[b+1][c].k === t.k) b++;
  return b - a >= 2;
}
function findMoves(S, limit){
  const g = S.g, out = [];
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++) for(const [dr, dc] of [[0,1],[1,0]]){
    const r2 = r + dr, c2 = c + dc;
    if(r2 >= ROWS || c2 >= COLS || g[r][c].k === g[r2][c2].k) continue;
    swapG(g, r, c, r2, c2); const ok = localMatch(S, r, c) || localMatch(S, r2, c2); swapG(g, r, c, r2, c2);
    if(ok){ out.push([{r, c}, {r:r2, c:c2}]); if(limit && out.length >= limit) return out; }
  }
  return out;
}
function collapse(S){
  const g = S.g, spawned = [];
  for(let c = 0; c < COLS; c++){
    let w = ROWS - 1;
    for(let r = ROWS - 1; r >= 0; r--){ if(g[r][c]){ if(w !== r){ g[w][c] = g[r][c]; g[r][c] = null; } w--; } }
    const empty = w + 1;
    for(let r = w; r >= 0; r--){ const t = newTile(S, randType(S)); g[r][c] = t; spawned.push({tile:t, r, c, from:r - empty}); }
  }
  return spawned;
}
function scoreOf(S, m, combo){
  let p = m.cells.size * 10 * combo;
  m.hits.forEach(h => { if(h.cells.length >= 5) p += 50; else if(h.cells.length === 4) p += 20; });
  return p;
}

const $ = s => document.querySelector(s);

const wait = ms => new Promise(res => setTimeout(res, ms));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// 題庫輪替：同一台裝置上，題庫裡每一題都出過一次以後才會重複（記在瀏覽器）
function Deck(key, ids){
  const all = ids.map(String), valid = new Set(all);
  const st = store.get(key, null) || {};
  let seen = new Set((st.s || []).filter(x => valid.has(x))), next = new Set((st.n || []).filter(x => valid.has(x)));
  if(seen.size >= all.length){ seen = next; next = new Set(); }
  const save = () => store.set(key, {s:Array.from(seen), n:Array.from(next)});
  return {
    // 先從還沒出過的題目抽；不夠時才從已出過的補，並避開新一輪已出過的
    draw(n, ok){
      const out = [];
      const take = list => { for(const x of shuffle(list)){ if(out.length >= n) return; if(out.includes(x) || (ok && !ok(x, out))) continue; out.push(x); } };
      take(all.filter(x => !seen.has(x)));
      if(out.length < n) take(all.filter(x => !next.has(x)));
      if(out.length < n) take(all);
      return out;
    },
    mark(id){
      id = String(id); if(!valid.has(id)) return;
      if(!seen.has(id)) seen.add(id); else next.add(id);
      if(seen.size >= all.length){ seen = next; next = new Set(); }
      save();
    },
    left(){ return all.filter(x => !seen.has(x)).length; }
  };
}
// 沒有固定題庫、由程式產生的題目：記住出過的，不再出（記滿 cap 筆就丟掉最舊的）
function SeenSet(key, cap){
  let arr = store.get(key, []) || [], set = new Set(arr);
  return {
    has(k){ return set.has(k); },
    add(k){ if(set.has(k)) return; arr.push(k); if(arr.length > cap) arr = arr.slice(-cap); set = new Set(arr); store.set(key, arr); },
    reset(){ arr = []; set = new Set(); store.set(key, arr); }
  };
}
// 每局抽到的拼法、單字輪流換，全部輪過才重複
const GROUPS = {pattern:Deck('lv-d-pattern', PATTERNS.map((_, i) => i)), vowel:Deck('lv-d-same-v', VOWELS)};
const SAME_WORDS = Object.fromEntries(VOWELS.map(v => [v, Deck('lv-d-same-' + v, ALL.filter(x => x.v === v).map(x => x.w))]));
const QKEY = 'lv-q', QMODES = ['sound','pattern'], ITEM_ID = it => it.w;
// 盤面補進來的字接續上一局的順序：同一組的字全部輪過才會從頭出現
function loadQueues(){
  if(!QMODES.includes(S.mode)) return;
  const all = store.get(QKEY, {}) || {};
  S.types.forEach(t => {
    const saved = all[S.mode + ':' + t.k];
    if(Array.isArray(saved) && saved.length){ const q = saved.map(x => t.items.find(it => ITEM_ID(it) === x)).filter(Boolean); if(q.length) t.q = q; }
  });
}
function saveQueues(){
  if(!S || !QMODES.includes(S.mode)) return;
  const all = store.get(QKEY, {}) || {};
  S.types.forEach(t => { all[S.mode + ':' + t.k] = (t.q || []).map(ITEM_ID); });
  store.set(QKEY, all);
}

function starHTML(n){ let h = ''; for(let i = 0; i < 3; i++) h += '<i class="' + (i < n ? 'on' : '') + '">★</i>'; return h; }
// 把單字裡的長母音拼法標紅
function hl(w, p){
  if(p.includes('_')){
    const v = p[0], m = w.match(new RegExp(v + '([^aeiou])e$', 'i'));
    if(m){ const i = m.index; return w.slice(0, i) + '<b>' + w[i] + '</b>' + w[i + 1] + '<b>' + w[i + 2] + '</b>'; }
    return w;
  }
  if(p === 'y') return w.slice(0, -1) + '<b>y</b>';
  const i = w.toLowerCase().lastIndexOf(p);
  return i < 0 ? w : w.slice(0, i) + '<b>' + w.slice(i, i + p.length) + '</b>' + w.slice(i + p.length);
}
const patLabel = p => p.replace('_', '_');
let AC = null;
function beep(ok, combo){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = AC.currentTime, base = ok ? 520 + Math.min(combo || 1, 5) * 70 : 230, notes = ok ? [base, base * 1.26] : [base, base * 0.8];
    notes.forEach((f, i) => {
      const o = AC.createOscillator(), gn = AC.createGain(), st = t0 + i * 0.08;
      o.type = ok ? 'triangle' : 'square'; o.frequency.value = f;
      gn.gain.setValueAtTime(0.0001, st); gn.gain.exponentialRampToValueAtTime(ok ? 0.12 : 0.04, st + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, st + 0.12);
      o.connect(gn); gn.connect(AC.destination); o.start(st); o.stop(st + 0.14);
    });
  }catch(e){}
}
let voice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
    voice = vs.find(v => /Samantha|Google US English|Jenny|Aria|Zira/i.test(v.name)) || vs[0] || null;
  }catch(e){ voice = null; }
}
if('speechSynthesis' in window){ pickVoice(); try{ speechSynthesis.onvoiceschanged = pickVoice; }catch(e){} }
let lastSay = '';
function say(text){
  lastSay = text;
  if(!speakOn || !('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.8; if(voice) u.voice = voice; speechSynthesis.speak(u); }catch(e){}
}

let S = null, busy = false, sel = null, drag = null, cur = {r:2, c:2};
let score = 0, moves = MOVES, learned = new Map(), hintT = 0, idleT = 0, gen = 0;
const EL = new Map();
function startGame(mode){
  gen++;
  let pick = null;
  if(mode === 'pattern'){ pick = GROUPS.pattern.draw(NTYPES).map(Number); pick.forEach(i => GROUPS.pattern.mark(i)); }
  else if(mode === 'same'){ const v = GROUPS.vowel.draw(1)[0]; GROUPS.vowel.mark(v); const words = SAME_WORDS[v].draw(NTYPES); words.forEach(w => SAME_WORDS[v].mark(w)); pick = {v, words}; }
  S = makeState(mode, pick); loadQueues(); fillBoard(S); saveQueues();
  score = 0; moves = MOVES; learned = new Map(); sel = null; drag = null; busy = false;
  boardEl.querySelectorAll('.tile,.pop').forEach(x => x.remove()); EL.clear();
  $('#pTitle').textContent = MODE[mode].name;
  $('#zhBtn').setAttribute('aria-pressed', String(zhOn));
  renderChips(); introCard(); setMsg(''); updateHUD();
  show('play'); dropIn(gen);
}
async function dropIn(g0){
  busy = true; const sp = [];
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++) sp.push({tile:S.g[r][c], r, c, from:r - ROWS - 1});
  spawn(sp); setDur(T.fall + 160); layout(); await wait(T.fall + 180);
  if(g0 === gen){ busy = false; poke(); }
}
function tileEl(t){
  let el = EL.get(t.id); if(el) return el;
  el = document.createElement('div'); el.className = 'tile';
  const face = document.createElement('div'); face.className = 'face'; face.dataset.len = Math.min(6, Math.max(3, t.w.length));
  if(t.ci) face.dataset.c = t.ci;
  face.textContent = t.w;
  el.appendChild(face); boardEl.appendChild(el); EL.set(t.id, el);
  return el;
}
function pos(el, r, c){ el.style.transform = 'translate(' + (c * 100) + '%,' + (r * 100) + '%)'; }
function setDur(ms){ boardEl.style.setProperty('--t-move', ms + 'ms'); }
function layout(){ for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){ const t = S.g[r][c]; if(t) pos(tileEl(t), r, c); } if(boardEl.classList.contains('kbd')) drawCur(); }
function spawn(list){ list.forEach(s => { const el = tileEl(s.tile); el.style.transition = 'none'; pos(el, s.from, s.c); }); void boardEl.offsetWidth; list.forEach(s => { EL.get(s.tile.id).style.transition = ''; }); }

const inB = p => p.r >= 0 && p.r < ROWS && p.c >= 0 && p.c < COLS;
function cellAt(e){ const rc = boardEl.getBoundingClientRect(); const c = Math.floor((e.clientX - rc.left) / rc.width * COLS), r = Math.floor((e.clientY - rc.top) / rc.height * ROWS); return inB({r, c}) ? {r, c} : null; }
boardEl.addEventListener('pointerdown', e => {
  if(busy || !S || moves <= 0) return;
  const cell = cellAt(e); if(!cell) return;
  e.preventDefault();
  drag = {r:cell.r, c:cell.c, x:e.clientX, y:e.clientY, done:false, id:e.pointerId};
  try{ boardEl.setPointerCapture(e.pointerId); }catch(_){}
  boardEl.classList.remove('kbd'); poke();
});
boardEl.addEventListener('pointermove', e => {
  if(!drag || drag.done || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, th = Math.max(12, boardEl.clientWidth / COLS * 0.3);
  if(Math.abs(dx) < th && Math.abs(dy) < th) return;
  drag.done = true;
  const to = Math.abs(dx) > Math.abs(dy) ? {r:drag.r, c:drag.c + (dx > 0 ? 1 : -1)} : {r:drag.r + (dy > 0 ? 1 : -1), c:drag.c};
  setSel(null);
  if(inB(to)) trySwap({r:drag.r, c:drag.c}, to);
});
function endDrag(e){ if(!drag || e.pointerId !== drag.id) return; const d = drag; drag = null; if(!d.done && e.type === 'pointerup') tap({r:d.r, c:d.c}); }
boardEl.addEventListener('pointerup', endDrag);
boardEl.addEventListener('pointercancel', endDrag);
boardEl.addEventListener('keydown', e => {
  if(!S) return; const k = e.key;
  if(k === 'ArrowUp') cur.r = Math.max(0, cur.r - 1);
  else if(k === 'ArrowDown') cur.r = Math.min(ROWS - 1, cur.r + 1);
  else if(k === 'ArrowLeft') cur.c = Math.max(0, cur.c - 1);
  else if(k === 'ArrowRight') cur.c = Math.min(COLS - 1, cur.c + 1);
  else if(k === 'Enter' || k === ' '){ e.preventDefault(); boardEl.classList.add('kbd'); drawCur(); tap({r:cur.r, c:cur.c}); return; }
  else if(k === 'Escape'){ setSel(null); return; }
  else return;
  e.preventDefault(); boardEl.classList.add('kbd'); drawCur(); poke();
});
function drawCur(){ boardEl.querySelectorAll('.tile.cur').forEach(x => x.classList.remove('cur')); const t = S && S.g[cur.r][cur.c]; const el = t && EL.get(t.id); if(el) el.classList.add('cur'); }
function tap(cell){
  if(busy || moves <= 0) return;
  if(sel){
    if(sel.r === cell.r && sel.c === cell.c){ setSel(null); return; }
    if(Math.abs(sel.r - cell.r) + Math.abs(sel.c - cell.c) === 1){ const a = sel; setSel(null); trySwap(a, cell); return; }
  }
  setSel(cell);
  const t = S.g[cell.r][cell.c]; say(t.w);
  if(zhOn) setMsg(t.w + '：' + t.zh);
}
function setSel(cell){ boardEl.querySelectorAll('.tile.sel').forEach(x => x.classList.remove('sel')); sel = cell; if(cell){ const el = EL.get(S.g[cell.r][cell.c].id); if(el) el.classList.add('sel'); } }

async function trySwap(a, b){
  if(busy || moves <= 0 || !inB(a) || !inB(b)) return;
  const g0 = gen; busy = true; clearHint(); setMsg('');
  swapG(S.g, a.r, a.c, b.r, b.c); setDur(T.swap); layout();
  await wait(T.swap + 20); if(g0 !== gen) return;
  let m = findMatches(S);
  if(!m.hits.length){
    swapG(S.g, a.r, a.c, b.r, b.c); layout(); beep(false);
    setMsg('這樣不能消，換回來了', 'warn');
    await wait(T.swap + 20); if(g0 !== gen) return;
    busy = false; poke(); return;
  }
  moves--; updateHUD();
  let combo = 0;
  while(m.hits.length){ combo++; await resolve(m, combo); if(g0 !== gen) return; m = findMatches(S); }
  if(moves <= 0){ busy = false; setTimeout(() => { if(g0 === gen) finish(); }, 500); return; }
  if(!findMoves(S, 1).length){ setMsg('沒有可以消的組合了，重新洗牌', 'warn'); await reshuffle(g0); if(g0 !== gen) return; }
  saveQueues(); busy = false; poke();
}
async function resolve(m, combo){
  const pts = scoreOf(S, m, combo);
  score += pts; beep(true, combo);
  record(m); showCard(m, combo, combo === 1); popScore(m, pts); updateHUD();
  const dying = [];
  m.cells.forEach(i => { const r = Math.floor(i / COLS), c = i % COLS, t = S.g[r][c]; const el = EL.get(t.id); if(el) el.classList.add('gone'); dying.push(t.id); S.g[r][c] = null; });
  await wait(T.pop);
  dying.forEach(id => { const el = EL.get(id); if(el) el.remove(); EL.delete(id); });
  const sp = collapse(S); spawn(sp); setDur(T.fall); layout();
  await wait(T.fall + 30);
}
async function reshuffle(g0){
  EL.forEach(el => el.classList.add('gone'));
  await wait(T.pop + 60); if(g0 !== gen) return;
  boardEl.querySelectorAll('.tile').forEach(x => x.remove()); EL.clear();
  fillBoard(S);
  const sp = []; for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++) sp.push({tile:S.g[r][c], r, c, from:r - ROWS - 1});
  spawn(sp); setDur(T.fall + 160); layout(); await wait(T.fall + 180);
}
function popScore(m, pts){
  let sr = 0, sc = 0, n = 0; m.cells.forEach(i => { sr += Math.floor(i / COLS); sc += i % COLS; n++; });
  const el = document.createElement('div'); el.className = 'pop'; el.textContent = '+' + pts;
  el.style.left = ((sc / n + 0.5) / COLS * 100) + '%'; el.style.top = ((sr / n + 0.5) / ROWS * 100) + '%';
  boardEl.appendChild(el); setTimeout(() => el.remove(), 850);
}

/* ===== 單字卡與紀錄 ===== */
function record(m){
  m.hits.forEach(h => {
    const tiles = h.cells.map(([r, c]) => S.g[r][c]);
    tiles.forEach(t => { const key = S.mode === 'pattern' ? t.p : t.v; let e = learned.get(key); if(!e){ e = new Map(); learned.set(key, e); } e.set(t.w, t); });
  });
}
function introCard(){
  const M = MODE[S.mode];
  $('#cWord').innerHTML = M.intro[0]; $('#cTitle').textContent = M.intro[1]; $('#cBody').textContent = M.intro[2];
  $('#cCombo').hidden = true; lastSay = '';
}
function uniqTiles(tiles){ const m = new Map(); tiles.forEach(t => m.set(t.w, t)); return Array.from(m.values()); }
function showCard(m, combo, speak){
  const h = m.hits[0], tiles = uniqTiles(h.cells.map(([r, c]) => S.g[r][c])), t = tiles[0];
  $('#cWord').innerHTML = hl(t.w, t.p);
  let title, body;
  if(S.mode === 'sound'){
    title = VNAME[t.v] + '　拼法不同、發音一樣';
    body = tiles.map(x => '<span class="en">' + hl(x.w, x.p) + '</span> ' + x.zh).join('・');
  }else if(S.mode === 'pattern'){
    title = '拼法 ' + t.p + '　念' + VNAME[t.v];
    body = tiles.map(x => '<span class="en">' + hl(x.w, x.p) + '</span> ' + x.zh).join('・');
  }else{
    title = t.w + '　' + t.zh;
    const sib = PATTERNS.filter(p => p[0] === t.v).map(p => p[1]).join('、');
    body = '拼法 <span class="en">' + t.p + '</span> 念' + VNAME[t.v] + '。同音的拼法還有：<span class="en">' + sib + '</span>';
  }
  if(m.hits.length > 1) body += '<br>這一步共消了 ' + m.hits.length + ' 組';
  $('#cTitle').textContent = title; $('#cBody').innerHTML = body;
  const cb = $('#cCombo'); cb.hidden = combo < 2; cb.textContent = '連消 ×' + combo;
  const text = tiles.map(x => x.w).join(', ');
  if(speak) say(text); else lastSay = text;
}
function renderChips(){
  const M = MODE[S.mode]; let h = '<span class="lbl">' + M.head + '</span>';
  if(S.mode === 'sound') h += S.types.map(t => '<span class="chip">' + VNAME[t.k] + ' <small class="en">' + PATTERNS.filter(p => p[0] === t.k).map(p => p[1]).join(' ') + '</small></span>').join('');
  else if(S.mode === 'pattern') h += S.types.map(t => '<span class="chip"><span class="en">' + t.k + '</span><small>' + VNAME[t.v] + '</small></span>').join('');
  else h += S.types.map(t => '<span class="chip"><span class="sw" style="background:var(--c' + t.ci + ')">' + t.k + '</span>' + t.items[0].zh + '</span>').join('');
  $('#chips').innerHTML = h;
}

/* ===== HUD、提示 ===== */
function updateHUD(){
  $('#pMoves').textContent = moves; $('#pScore').textContent = score;
  $('#movesStat').classList.toggle('low', moves <= 5);
  const th = STARS[S.mode], top = th[2];
  $('#meterFill').style.width = Math.min(score / top, 1) * 100 + '%';
  [1, 2, 3].forEach(i => { const mk = $('#mk' + i); mk.style.left = (th[i - 1] / top * 100) + '%'; mk.classList.toggle('on', score >= th[i - 1]); });
}
function setMsg(t, cls){ const m = $('#msg'); m.textContent = t; m.className = 'msg' + (cls ? ' ' + cls : ''); }
function clearHint(){ clearTimeout(hintT); boardEl.querySelectorAll('.tile.hint').forEach(x => x.classList.remove('hint')); }
function hint(auto){
  if(!S || busy || moves <= 0) return;
  clearHint(); const mv = findMoves(S); if(!mv.length) return;
  const [a, b] = mv[rint(mv.length)];
  [a, b].forEach(p => { const el = EL.get(S.g[p.r][p.c].id); if(el) el.classList.add('hint'); });
  if(!auto) setMsg('試試看交換閃動的兩個單字');
  hintT = setTimeout(clearHint, 2800);
}
function poke(){ clearTimeout(idleT); idleT = setTimeout(() => { if(!$('#play').hidden) hint(true); }, 15000); }

function finish(){
  clearTimeout(idleT); clearHint(); saveQueues();
  const th = STARS[S.mode], st = score >= th[2] ? 3 : score >= th[1] ? 2 : score >= th[0] ? 1 : 0;
  if(st > (best[S.mode] || 0)){ best[S.mode] = st; store.set('lv-best', best); }
  $('#rTitle').textContent = MODE[S.mode].name + '・本局結束';
  $('#rScore').textContent = score; $('#rStars').innerHTML = starHTML(st); $('#rStars').setAttribute('aria-label', st + ' 顆星');
  $('#rLine').textContent = st < 3 ? '再拿 ' + (th[st] - score) + ' 分就有 ' + (st + 1) + ' 顆星。' : '拿到 3 顆星。';
  const list = $('#rList'); list.innerHTML = '';
  const add = (html, miss) => { const li = document.createElement('li'); if(miss) li.className = 'miss'; li.innerHTML = html; list.appendChild(li); };
  learned.forEach((words, key) => {
    const label = S.mode === 'pattern' ? '<b class="en">' + key + '</b>' : '<b>' + VNAME[key] + '</b>';
    add(label + '：' + Array.from(words.values()).map(t => '<span class="en">' + hl(t.w, t.p) + '</span> ' + t.zh).join('、'));
  });
  if(!list.children.length) add('這局沒有消到任何組合。', true);
  show('result');
}

$('#hintBtn').addEventListener('click', () => { hint(false); poke(); });
$('#zhBtn').addEventListener('click', () => { zhOn = !zhOn; store.set('lv-zh', zhOn); $('#zhBtn').setAttribute('aria-pressed', String(zhOn)); setMsg(zhOn ? '點單字時會在這裡顯示中文意思' : ''); });
$('#cSay').addEventListener('click', () => { if(lastSay){ const keep = speakOn; speakOn = true; say(lastSay); speakOn = keep; } });
$('#newBtn').addEventListener('click', () => startGame(S.mode));
$('#backBtn').addEventListener('click', () => { gen++; clearTimeout(idleT); clearHint(); renderHome(); });
$('#againBtn').addEventListener('click', () => startGame(S.mode));
$('#homeBtn').addEventListener('click', renderHome);
$('#soundBtn').addEventListener('click', () => { soundOn = !soundOn; store.set('lv-sound', soundOn); $('#soundBtn').textContent = '音效：' + (soundOn ? '開' : '關'); });
$('#speakBtn').addEventListener('click', () => { speakOn = !speakOn; store.set('lv-speak', speakOn); $('#speakBtn').textContent = '唸單字：' + (speakOn ? '開' : '關'); });

renderBank(); renderHome();
})();
</script>
